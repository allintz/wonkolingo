<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>WonkoLingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Source+Serif+4:ital,opsz,wght@1,8..60,500&display=swap">
<style>
/* Layout: sticky stat bar; zigzag lesson path under unit banners, beside a narrow side column; lessons open as a full-screen drill whose footer turns green or red on Check. */
:root {
  --bg: #f6f7fb; --surface: #ffffff; --fg: #162033; --muted: #5a6479; --line: #dbe0ea; --line-deep: #c3cad8;
  --primary: #2f5fd0; --primary-deep: #1e3f96; --primary-soft: #e4ecfd; --on-primary: #ffffff;
  --brass: #a8720c; --brass-soft: #fbf0d6;
  --good: #2f8a2a; --good-deep: #1f6a1b; --good-bg: #e3f4dc;
  --bad: #c93a32; --bad-deep: #9a2620; --bad-bg: #fbe4e2;
  --locked: #d3d9e3; --locked-deep: #b5bdcc; --locked-fg: #7d879a;
  --f-ui: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --f-quote: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1320; --surface: #171f31; --fg: #e6ebf5; --muted: #99a4ba; --line: #28324a; --line-deep: #344060;
  --primary: #7398f2; --primary-deep: #3d5fb8; --primary-soft: #1d2a4a; --on-primary: #0e1320;
  --brass: #e3ae49; --brass-soft: #3a2f17;
  --good: #6cc65e; --good-deep: #3f8f34; --good-bg: #18301c;
  --bad: #f2766d; --bad-deep: #b04640; --bad-bg: #3b1c1b;
  --locked: #2a3349; --locked-deep: #1f2638; --locked-fg: #6f7a91;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #171f31; --fg: #e6ebf5; --muted: #99a4ba; --line: #28324a; --line-deep: #344060;
  --primary: #7398f2; --primary-deep: #3d5fb8; --primary-soft: #1d2a4a; --on-primary: #0e1320;
  --brass: #e3ae49; --brass-soft: #3a2f17;
  --good: #6cc65e; --good-deep: #3f8f34; --good-bg: #18301c;
  --bad: #f2766d; --bad-deep: #b04640; --bad-bg: #3b1c1b;
  --locked: #2a3349; --locked-deep: #1f2638; --locked-fg: #6f7a91;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 16px; line-height: 1.45; font-weight: 600; }
body.in-lesson { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
svg { display: block; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 2px solid var(--line); }
.top-in { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 22px; letter-spacing: -0.01em; color: var(--primary); }
.brand svg { width: 30px; height: 30px; }
.stats { display: flex; gap: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat { display: flex; align-items: center; gap: 6px; }
.stat svg { width: 22px; height: 22px; }
.stat.streak { color: var(--brass); }
.stat.xp { color: var(--primary); }
.stat.hearts { color: var(--bad); }

/* home */
.home { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
.path { display: grid; gap: 28px; min-width: 0; }
.unit { display: grid; gap: 20px; }
.banner { background: var(--primary); color: var(--on-primary); border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; box-shadow: 0 4px 0 var(--primary-deep); }
.unit.is-locked .banner { background: var(--locked); color: var(--locked-fg); box-shadow: 0 4px 0 var(--locked-deep); }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.banner h2 { margin: 2px 0 2px; font-size: 22px; font-weight: 900; text-wrap: balance; }
.banner p { margin: 0; font-weight: 600; opacity: .92; max-width: 46ch; }
.jump { flex: none; background: var(--surface); color: var(--fg); border: 2px solid var(--line-deep); border-bottom-width: 4px; border-radius: 12px; padding: 8px 14px; font-weight: 800; font-size: 14px; }
.jump:active { transform: translateY(2px); border-bottom-width: 2px; }
.nodes { display: grid; justify-items: center; gap: 22px; padding-block: 6px 10px; --zig: 1; }
.node-wrap { position: relative; display: grid; justify-items: center; gap: 6px; transform: translateX(calc(var(--x) * var(--zig))); }
.node { width: 72px; height: 72px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); box-shadow: 0 6px 0 var(--primary-deep); transition: transform .08s; }
.node svg { width: 32px; height: 32px; }
.node:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--primary-deep); }
.node.done { background: var(--brass); box-shadow: 0 6px 0 color-mix(in srgb, var(--brass) 60%, #000); }
.node.locked { background: var(--locked); color: var(--locked-fg); box-shadow: 0 6px 0 var(--locked-deep); cursor: not-allowed; }
.node.current { box-shadow: 0 6px 0 var(--primary-deep), 0 0 0 8px var(--primary-soft); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 6px 0 var(--primary-deep), 0 0 0 13px var(--primary-soft); } }
.node-label { font-size: 14px; font-weight: 800; color: var(--muted); text-align: center; max-width: 16ch; }
.start { position: absolute; top: -40px; background: var(--surface); color: var(--primary); border: 2px solid var(--line); border-radius: 10px; padding: 3px 12px; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.start::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }

.side { display: grid; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); min-width: 0; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px; min-width: 0; }
.card h3 { margin: 0; font-size: 17px; font-weight: 900; }
.card p { margin: 0; font-weight: 600; color: var(--muted); font-size: 15px; }
.card .quote-sm { font-family: var(--f-quote); font-style: italic; font-size: 19px; line-height: 1.35; color: var(--fg); }
.card .who-sm { font-size: 13px; color: var(--muted); }
.reveal-body { display: grid; gap: 8px; }
.reveal-body[hidden] { display: none; }
.reveal-body b { color: var(--good); }
.meta { font-size: 13px; color: var(--muted); font-weight: 700; }
.bar-mini { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar-mini > i { display: block; height: 100%; background: var(--brass); }
.kv { display: flex; justify-content: space-between; font-weight: 800; font-variant-numeric: tabular-nums; }
.linkbtn { justify-self: start; background: none; border: 0; padding: 0; color: var(--primary); font-weight: 800; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* course tabs */
.path-col { display: grid; gap: 24px; min-width: 0; }
.tabs { display: flex; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 6px; }
.tab { flex: 1; border: 0; background: none; border-radius: 11px; padding: 10px 12px; font-weight: 900; font-size: 15px; color: var(--muted); letter-spacing: .02em; }
.tab.on { background: var(--primary); color: var(--on-primary); box-shadow: 0 3px 0 var(--primary-deep); }
.tab:not(.on):hover { background: var(--primary-soft); color: var(--primary); }
.potd-q { color: var(--fg) !important; font-weight: 800 !important; font-size: 16px !important; }

/* news card */
.news { background: var(--surface); border: 2px solid var(--line); border-left: 6px solid var(--brass); border-radius: 12px; padding: 12px 16px; display: grid; gap: 4px; }
.news-k { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--brass); }
.news-h { margin: 0; font-family: var(--f-quote); font-style: italic; font-size: 20px; line-height: 1.3; }
.news-d { font-size: 13px; color: var(--muted); font-weight: 700; }

/* group play */
.seg { display: flex; gap: 4px; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 6px 8px; font-weight: 800; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--primary); box-shadow: 0 1px 0 var(--line-deep); }
.fld { display: grid; gap: 4px; font-size: 13px; font-weight: 800; color: var(--muted); }
.fld input { font: inherit; font-size: 16px; font-weight: 700; color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0; }
.fld input:focus { outline: none; border-color: var(--primary); }
.btn.sm { padding: 10px 16px; font-size: 14px; min-width: 0; justify-self: start; }
.card .gerr { color: var(--bad); font-weight: 700; }
.card .gerr a { color: inherit; }
.ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lb { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lb li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; font-weight: 800; font-size: 15px; }
.lb li.me { background: var(--primary-soft); }
.lb .rk { color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
.lb .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb .fl { display: flex; align-items: center; gap: 2px; color: var(--brass); font-variant-numeric: tabular-nums; }
.lb .fl.zero { color: var(--locked-fg); }
.lb .fl.risk { color: var(--bad); }
.lb .fl svg { width: 16px; height: 16px; }
.lb .pts { color: var(--primary); font-variant-numeric: tabular-nums; min-width: 58px; text-align: right; }
.gsub { margin: 6px 0 0; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.feed li { font-size: 14px; color: var(--muted); font-weight: 600; line-height: 1.35; }
.feed b { color: var(--fg); }
.beat { margin-left: 4px; background: none; border: 2px solid var(--line-deep); border-radius: 8px; padding: 0 8px; font-size: 12px; font-weight: 900; color: var(--primary); }
.rec { display: block; font-size: 13px; word-break: break-all; background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 6px 8px; color: var(--fg); }
.glinks { display: flex; flex-wrap: wrap; gap: 14px; }
.result .vs { color: var(--fg); font-weight: 800; }

/* group courses */
.tabs { overflow-x: auto; scrollbar-width: thin; }
.tab { flex: 1 0 auto; white-space: nowrap; }
.tab.add { flex: 0 0 auto; color: var(--primary); border: 2px dashed var(--line-deep); }
.cinfo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-top: -12px; font-size: 14px; font-weight: 700; color: var(--muted); }
.cinfo .cdesc { flex-basis: 100%; font-weight: 600; }
.sheet .lbar h2 { margin: 0; font-size: 20px; font-weight: 900; }
.prompt.sm { font-size: 20px; }
.sheet textarea, .repbox textarea { font: 500 14px/1.45 ui-monospace, "SF Mono", Menlo, monospace; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; resize: vertical; }
.repbox textarea { font-family: var(--f-ui); font-size: 15px; font-weight: 600; }
.sheet textarea:focus, .repbox textarea:focus { outline: none; border-color: var(--primary); }
.sheet p { margin: 0; color: var(--muted); max-width: 62ch; }
.sheet p a { color: var(--primary); font-weight: 800; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.okbox, .errbox { border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.okbox { background: var(--good-bg); }
.okbox p { color: var(--fg); }
.errbox { background: var(--bad-bg); }
.errbox ul { margin: 0; padding-left: 18px; font-size: 14px; font-weight: 600; }
.errbox h4, .okbox h4 { margin: 0; font-size: 16px; font-weight: 900; }
.replist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.replist li { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.replist .rq { font-family: var(--f-quote); font-style: italic; font-size: 17px; }
.replist .rn { font-weight: 700; }
.repbox { display: grid; gap: 8px; margin-top: 4px; }

/* course picker + welcome */
.picker { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; padding: 12px 16px; }
.picker:hover { border-color: var(--line-deep); }
.picker .pk-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.picker .pk-k { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.picker .pk-n { font-size: 19px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker .pk-p { flex: none; font-size: 14px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.picker svg { flex: none; width: 22px; height: 22px; color: var(--primary); }
.welcome { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 28px 24px; display: grid; gap: 14px; }
.welcome h2 { margin: 0; font-size: 30px; font-weight: 900; line-height: 1.15; text-wrap: balance; }
.welcome p { margin: 0; color: var(--muted); font-size: 17px; max-width: 54ch; }
.steps { margin: 4px 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: st; }
.steps li { counter-increment: st; display: flex; gap: 12px; align-items: baseline; font-size: 16px; }
.steps li::before { content: counter(st); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 900; font-size: 14px; }
.pk-sec { display: grid; gap: 8px; }
.pk-sec h4 { margin: 8px 0 0; font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pk-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; padding: 12px 14px; }
.pk-item:hover { border-color: var(--line-deep); }
.pk-item.on { border-color: var(--primary); background: var(--primary-soft); }
.pk-item .t { font-weight: 900; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk-item .s { grid-column: 1; font-size: 13px; font-weight: 700; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pk-item .n { grid-row: 1 / span 2; grid-column: 2; font-size: 13px; font-weight: 800; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; display: grid; gap: 4px; justify-items: end; }
.pk-item .n .bar-mini { width: 72px; }
.pk-empty { background: var(--bg); border: 2px dashed var(--line-deep); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.pk-search { font: inherit; font-size: 16px; font-weight: 700; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
.pk-search:focus { outline: none; border-color: var(--primary); }

/* daily session, typed answers */
.today { background: var(--primary); color: var(--on-primary); border-radius: 18px; padding: 20px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; box-shadow: 0 5px 0 var(--primary-deep); }
.today .kicker { color: inherit; opacity: .85; }
.today h2 { margin: 2px 0 4px; font-size: 26px; font-weight: 900; }
.today p { margin: 0; opacity: .92; max-width: 48ch; }
.today .btn { background: var(--surface); color: var(--primary); box-shadow: 0 4px 0 var(--primary-deep); flex: none; }
.today.done { background: var(--surface); color: var(--fg); border: 2px solid var(--line); box-shadow: none; }
.today.done .kicker { color: var(--primary); opacity: 1; }
.today.done p { color: var(--muted); }
.today.done .btn { background: var(--surface); color: var(--fg); border: 2px solid var(--line-deep); box-shadow: 0 4px 0 var(--line-deep); }
.cardtag { margin: 0; font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.recall-in { font: 600 17px/1.45 var(--f-ui); color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; resize: vertical; }
.recall-in:focus { outline: none; border-color: var(--primary); }
.conf { display: grid; gap: 8px; justify-items: start; }
.conf-k { font-size: 13px; font-weight: 800; color: var(--muted); }
.conf-alt { display: flex; flex-wrap: wrap; gap: 18px; }
.conf-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.cbtn { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; padding: 10px 14px; font-weight: 800; font-size: 15px; }
.cbtn:hover { border-color: var(--primary); }
.cbtn:disabled, .conf .linkbtn:disabled { opacity: .5; cursor: default; }
.recall-ans { background: var(--surface); border: 2px solid var(--line); border-left: 6px solid var(--good); border-radius: 12px; padding: 10px 14px; display: grid; gap: 2px; }
.recall-ans span { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--good); }
.recall-ans p { margin: 0; font-weight: 700; color: var(--fg); }
.fb .aifb { font-weight: 700; color: var(--fg); }
.fb .second { border-left: 4px solid var(--primary); padding-left: 10px; display: grid; gap: 2px; }
.fb .second span { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
.fb .second p { color: var(--fg); font-weight: 700; }
.fb .checking { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--muted); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--primary); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.gpct { font-variant-numeric: tabular-nums; margin-right: 8px; }
.gpts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.gpts li { display: grid; gap: 2px; border-left: 4px solid var(--line-deep); padding: 2px 0 2px 10px; font-size: 15px; font-weight: 600; }
.gpts li b { color: var(--fg); font-weight: 800; }
.gpts .gv { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
.gpts .v-ok { border-left-color: var(--good); } .gpts .v-ok .gv { color: var(--good); }
.gpts .v-part { border-left-color: var(--brass); } .gpts .v-part .gv { color: var(--brass); }
.gpts .v-no { border-left-color: var(--bad); } .gpts .v-no .gv { color: var(--bad); }
.gpts .v-unsure .gv { color: var(--muted); }
.gmiss { display: grid; gap: 2px; font-size: 15px; font-weight: 600; }
.gmiss span { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.gmiss ul { margin: 0; padding-left: 18px; }
.fb .gq { font-weight: 800; color: var(--fg); }
.grades { display: flex; flex-wrap: wrap; gap: 8px; }
.gbtn { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; padding: 8px 12px; font-size: 15px; }
.gbtn:hover { border-color: var(--primary); }
.fb .whynot { border-left: 4px solid var(--bad); padding-left: 10px; }
.fb .whynot span { display: block; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--bad); }
@media (max-width: 520px) { .today { flex-direction: column; align-items: stretch; } .today h2 { font-size: 22px; } }

/* streak card, hints */
.sk-row { display: flex; align-items: center; gap: 8px; color: var(--brass); }
.sk-row.risk { color: var(--bad); }
.sk-f { width: 34px; height: 34px; }
.sk-n { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.sk-d { font-size: 15px; font-weight: 800; color: var(--muted); }
.flakes { display: flex; gap: 4px; }
.flake { width: 22px; height: 22px; color: var(--locked); }
.flake svg { width: 22px; height: 22px; }

<script>
const KEY = 'hillspeak-v1';
const SPEAKERS = {
  m: { n: 'Marcus', r: 'Legislative Director, Senate office' },
  p: { n: 'Priya', r: 'Legislative Assistant, House office' },
  t: { n: 'Tom', r: 'Professional Staff Member, Senate committee' }
};

const UNITS = [
  { title: 'The Polite No', desc: 'Most meetings end warmly. Learn to tell warmth from commitment.', lessons: [
    { title: 'Holding phrases', items: [
      { t: 'mc', who: 'm', q: '“We’re monitoring the issue closely.”',
        o: ['They’re drafting their own bill on it', 'No position, and no plans to take one soon', 'They support it but can’t say so publicly', 'They’re opposed and will work against it'], a: 1,
        x: '“Monitoring” is the standard holding phrase. It commits the office to nothing. If they were drafting something, they would usually say so, because offices want advocates to know they’re leading.',
        ask: '“Is the boss likely to take a position this Congress, or is this one you’re watching for now?”' },
      { t: 'mc', who: 'p', q: '“I’ll definitely take this back to the boss.”',
        o: ['The member will read your materials personally', 'A routine way to close; it tells you little either way', 'A soft yes', 'A soft no'], a: 1,
        x: 'Staff say this at the end of nearly every meeting. The real signal comes later: a follow-up email with specific questions means it went somewhere. Silence means it probably didn’t.',
        ask: '“What would be most useful for me to send before you brief her?”' },
      { t: 'mc', who: 'm', q: '“The senator is supportive of the goals of the bill.”',
        o: ['She’ll cosponsor if asked', 'She likes the idea in public but isn’t ready to sign on to this text', 'She’s already a cosponsor', 'She opposes it'], a: 1,
        x: 'Praising the “goals” separates the idea from the bill. It lets the office say nice things without signing on. For now, it usually means no cosponsorship.',
        ask: '“What would need to change in the text for her to sign on?”' },
      { t: 'mc', who: 'm', q: '“That’s a heavy lift this Congress.”',
        o: ['It’s hard, but they’ll push for it', 'It probably won’t move this Congress, and the office won’t spend capital trying', 'They need help counting votes', 'It’s going to markup soon'], a: 1,
        x: '“Heavy lift” is usually a polite forecast that nothing will happen. Sometimes it’s an accurate read of the floor; sometimes it covers the office not wanting to try. Either way, don’t plan around passage.',
        ask: '“What would make it lighter: a different vehicle, a narrower version, or more Republicans on board?”' }
    ]},
    { title: 'Reading the temperature', items: [
      { t: 'mc', who: 'p', q: '“Happy to keep the lines of communication open.”',
        o: ['They want monthly check-ins', 'The meeting is over and nothing was committed', 'They want to be the lead office', 'They want you to testify'], a: 1,
        x: 'This is a goodbye. It keeps the relationship friendly without promising anything. A follow-up is fine, but don’t read this line as interest.' },
      { t: 'mc', who: 'm', q: '“We’d want to see who else is on before we commit.”',
        o: ['A brush-off', 'A real condition: they’ll consider it once other offices take the risk first', 'They want your donor list', 'A firm yes'], a: 1,
        x: 'One of the more useful lines you’ll hear. Offices want political cover, especially from the other party or their own state delegation. It’s a request for information you can actually meet.',
        ask: '“Which offices’ support would matter most to the senator?”' },
      { t: 'mc', who: 'p', q: '“The boss has some concerns.”',
        o: ['A firm no', 'Real but unnamed objections; could be policy, could be politics', 'They want a bigger version', 'They didn’t read it'], a: 1,
        x: 'Concerns can mean a fixable drafting problem or an in-district company lobbying against the bill. The office often won’t say which unless you ask, so your job is to find out.',
        ask: '“Are the concerns about the policy itself, or about who’s opposing it?”' },
      { t: 'order', p: 'Put these in order from coldest to warmest.', ends: ['Coldest', 'Warmest'],
        items: ['“We’re monitoring it.”', '“The boss supports the goals.”', '“We’d want to see who else is on.”', '“Can you send the text and the cosponsor list?”', '“Who should I talk to in the lead sponsor’s office?”'],
        x: 'Roughly: watching, then praising the idea, then naming a condition, then asking for materials, then asking how to join. Treat this as a rule of thumb. A particular staffer’s habits can reshuffle the middle.' }
    ]}
  ]},
  { title: 'Process Words', desc: 'The vocabulary of how a bill actually moves.', lessons: [
    { title: 'Committee and cost', items: [
      { t: 'match', p: 'Match each term to its meaning.', pairs: [
        ['Markup', 'Committee session where members amend and vote on a bill'],
        ['Vehicle', 'A bill likely to pass that other provisions can ride on'],
        ['Pay-for', 'A spending cut or revenue that offsets a bill’s cost'],
        ['Score', 'CBO’s estimate of what a bill would cost'],
        ['Dear Colleague', 'A letter one office sends to all offices, often seeking cosponsors']],
        x: 'These five come up in almost every legislative meeting.' },
      { t: 'mc', who: 'm', q: '“Has it been scored?”', p: 'Why would a staffer ask this?',
        o: ['They want your organization’s rating of the member', 'They’re checking whether CBO has estimated the cost, which suggests they’re thinking about passage', 'They want polling numbers', 'They’re asking about the markup vote count'], a: 1,
        x: 'Cost matters once a bill might actually move, so this question is usually a sign of real interest. If there’s no score yet, expect to hear the question again.' },
      { t: 'mc', who: 't', q: '“We’d need to find a vehicle for this.”',
        o: ['The bill needs a new sponsor', 'It probably won’t pass on its own and would need to ride on must-pass legislation', 'They need a press event', 'It needs a companion bill in the House'], a: 1,
        x: 'Most standalone bills never get floor time. Provisions often ride on bills that have to pass, like the NDAA (the annual defense authorization) or appropriations. A lot of AI policy has moved this way.',
        ask: '“Which vehicle looks realistic, and when does that text get locked?”' },
      { t: 'mc', who: 't', q: '“The Chair wants regular order on this.”',
        o: ['Leadership will write it behind closed doors', 'It should go through committee hearings and markup before the floor', 'It should pass by unanimous consent', 'It should be attached to the budget'], a: 1,
        x: '“Regular order” means the textbook process: hearings, markup, then the floor. Hearing it from committee staff means you’ll work through them, and the timeline will be slower.' }
    ]},
    { title: 'Floor mechanics', items: [
      { t: 'match', p: 'Match each term to its meaning.', pairs: [
        ['Hold', 'A senator’s notice they’ll object to fast-tracking a bill or nominee'],
        ['Unanimous consent', 'Senate action taken with no objection; one senator can block it'],
        ['Cloture', 'Senate vote to end debate; usually needs 60'],
        ['Suspension', 'House fast track: limited debate, needs two-thirds'],
        ['Hotline', 'Leadership asks every Senate office whether it objects to passing something by UC']],
        x: 'All five are about speed: how a bill skips steps, and how one member can stop it.' },
      { t: 'mc', who: 't', q: '“We could try to hotline it.”',
        o: ['Call the White House', 'Try to pass it quickly in the Senate by checking that no office objects', 'Leak it to the press', 'Move it under suspension'], a: 1,
        x: 'Hotlining works for noncontroversial bills. A single hold stops it, which is why staff will ask whether anyone is likely to object.' },
      { t: 'mc', who: 'p', q: '“Honestly, it’s a messaging bill.”',
        o: ['A bill about communications policy', 'A bill introduced to make a point, not expected to pass', 'A bill written by the press office', 'A bill that passed by voice vote'], a: 1,
        x: 'Messaging bills stake out a position for the party or a campaign. Cosponsoring one is cheap, so it tells you less about how the member would vote on a real deal.' },
      { t: 'mc', who: 'm', q: '“That’s a Byrd rule problem.”',
        o: ['It would violate Senate ethics rules', 'In a reconciliation bill, provisions that are mainly policy rather than budget can be struck', 'It needs 67 votes', 'It conflicts with a House rule'], a: 1,
        x: 'Reconciliation bills pass the Senate with a simple majority, but the Byrd rule lets senators strike provisions that aren’t mainly about the budget. In 2025, the proposed moratorium on state AI laws was rewritten around broadband funding to survive it; the Senate then voted 99-1 to remove it anyway.' }
    ]}
  ]},
  { title: 'Who’s Who', desc: 'Who you meet tells you how the office is treating your issue.', lessons: [

/* COURSE-FORMAT START: build.sh copies this block into the server as src/course-format.js, so keep it free of DOM code. */
const COURSE_FORMAT = 'wonkolingo-course/1';
const COURSE_FORMATS_ACCEPTED = [COURSE_FORMAT, 'hill-speak-course/1'];
const COURSE_LIMITS = { units: 12, lessons: 8, items: 15, totalItems: 400, bytes: 200000 };
function validateCourse(raw) {
  const errors = [];
  const err = (where, msg) => { if (errors.length < 40) errors.push(where + ': ' + msg); };
  const str = (v, where, max, required = true) => {
    if (v === undefined || v === null || v === '') { if (required) err(where, 'is required'); return undefined; }
    if (typeof v !== 'string') { err(where, 'must be text'); return undefined; }
    const s = v.trim();
    if (s.length > max) err(where, `is ${s.length} characters; the limit is ${max}`);
    return s.slice(0, max);
  };
  const arr = (v, where, min, max) => {
    if (!Array.isArray(v)) { err(where, 'must be a list'); return []; }
    if (v.length < min || v.length > max) err(where, `has ${v.length} entries; it needs ${min} to ${max}`);
    return v.slice(0, max);
  };
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return { ok: false, errors: ['The file must be a single JSON object.'] };
  if (!COURSE_FORMATS_ACCEPTED.includes(raw.format)) err('format', `must be "${COURSE_FORMAT}"`);
  const c = { format: COURSE_FORMAT };
  c.id = str(raw.id, 'id', 40);
  if (c.id && !/^[a-z0-9][a-z0-9-]{1,39}$/.test(c.id)) err('id', 'must be 2 to 40 lowercase letters, numbers or hyphens');
  c.title = str(raw.title, 'title', 40);
  c.description = str(raw.description, 'description', 200, false) || '';
  c.caveat = str(raw.caveat, 'caveat', 400, false) || '';
  c.speakers = {};
  if (raw.speakers !== undefined) {
    if (!raw.speakers || typeof raw.speakers !== 'object' || Array.isArray(raw.speakers)) err('speakers', 'must be an object');
    else Object.entries(raw.speakers).slice(0, 8).forEach(([k, v]) => {
      if (!/^[a-z]{1,8}$/.test(k)) { err('speakers.' + k, 'key must be 1 to 8 lowercase letters'); return; }
      c.speakers[k] = { n: str(v && v.n, `speakers.${k}.n`, 30), r: str(v && v.r, `speakers.${k}.r`, 60, false) || '' };
    });
  }
  let total = 0;
  c.units = arr(raw.units, 'units', 1, COURSE_LIMITS.units).map((u, ui) => {
    const uw = `units[${ui}]`;
    u = u || {};
    return { title: str(u.title, uw + '.title', 60), desc: str(u.desc, uw + '.desc', 200, false) || '',
      lessons: arr(u.lessons, uw + '.lessons', 1, COURSE_LIMITS.lessons).map((l, li) => {
        const lw = `${uw}.lessons[${li}]`;
        l = l || {};
        return { title: str(l.title, lw + '.title', 60), items: arr(l.items, lw + '.items', 2, COURSE_LIMITS.items).map((it, ii) => {
          total++;
          const w = `${lw}.items[${ii}]`;
          it = it || {};
          const x = str(it.x, w + '.x (explanation)', 700);
          if (it.t === 'mc') {
            const o = arr(it.o, w + '.o (options)', 2, 5).map((s, k) => str(s, `${w}.o[${k}]`, 200));
            const out = { t: 'mc', o, a: it.a, x };
            if (!Number.isInteger(it.a) || it.a < 0 || it.a >= o.length) err(w + '.a', 'must be the 0-based position of the right option');
            if (new Set(o).size !== o.length) err(w + '.o', 'has duplicate options');
            const q = str(it.q, w + '.q', 300, false), p = str(it.p, w + '.p', 300, false);
            if (!q && !p) err(w, 'needs a question (p) or a quote (q)');
            if (q) out.q = q; if (p) out.p = p;
            if (it.who !== undefined) { if (typeof it.who !== 'string' || !c.speakers[it.who]) err(w + '.who', 'must be a key from speakers'); else out.who = it.who; }

// Streak rules, shared with the server so the leaderboard shows the same number.
// days: list of YYYY-MM-DD days with practice. settings.days: 7 booleans, Sunday first, for days that count.
// settings.pauses: [{ from, to }] (to null = still paused). Off days and paused days never break a streak.
// Every STREAK_RULES.freezeEvery practice days earns a freeze (up to maxFreezes); a missed counting day uses one automatically.
const STREAK_RULES = { freezeEvery: 5, maxFreezes: 3 };
function computeStreak(days, settings, today) {
  const ok = d => typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d);
  const set = new Set((days || []).filter(ok));
  const sched = settings && Array.isArray(settings.days) && settings.days.length === 7 && settings.days.some(Boolean) ? settings.days.map(Boolean) : [true, true, true, true, true, true, true];
  const pauses = settings && Array.isArray(settings.pauses) ? settings.pauses.filter(p => p && ok(p.from)) : [];
  const paused = d => pauses.some(p => d >= p.from && (!p.to || d <= p.to));
  const dow = d => new Date(d + 'T12:00:00Z').getUTCDay();
  const next = d => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + 1); return x.toISOString().slice(0, 10); };
  const sorted = [...set].filter(d => d <= today).sort();
  let streak = 0, bank = 0, progress = 0, best = 0;
  const frozen = [];
  const practice = () => { streak++; if (++progress >= STREAK_RULES.freezeEvery) { progress = 0; bank = Math.min(STREAK_RULES.maxFreezes, bank + 1); } };
  if (sorted.length) {
    for (let d = sorted[0]; d < today; d = next(d)) {
      if (set.has(d)) practice();
      else if (paused(d) || !sched[dow(d)]) { /* off day: no change */ }
      else if (bank > 0) { bank--; frozen.push(d); }
      else streak = 0;
      best = Math.max(best, streak);
    }
  }
  const doneToday = set.has(today);
  if (doneToday) { practice(); best = Math.max(best, streak); }
  const pausedNow = paused(today), offToday = pausedNow || !sched[dow(today)];
  return { streak, best, freezes: bank, progress, toNextFreeze: bank >= STREAK_RULES.maxFreezes ? 0 : STREAK_RULES.freezeEvery - progress, frozen, doneToday, offToday, pausedNow, atRisk: streak > 0 && !doneToday && !offToday };
}

const FSRS_W = [0.4872, 1.4003, 3.7145, 13.8206, 5.1618, 1.2298, 0.8975, 0.031, 1.6474, 0.1367, 1.0461, 2.1072, 0.0793, 0.3246, 1.587, 0.2272, 2.8755];

function fsrsNext(card, g, today) {
  const W = FSRS_W;

  if (!it._card || run.graded.has(it._card)) return;
  run.graded.add(it._card);
  const today = dstr(new Date()), prev = state.srs[it._card];
  state.srs[it._card] = fsrsNext(prev, g, today);
  if (!prev) {
    if (state.newDay !== today) { state.newDay = today; state.newCount = 0; }
    state.newCount++; run.newSeen++; run.xp += g > 1 ? 5 : 1;
  } else {
    // Only reviews that were actually due earn full credit, so replaying fresh material can't farm XP.
    const wasDue = prev.due <= today;
    run.reviewed++; if (g > 1) run.remembered++;
    run.xp += wasDue ? (g > 1 ? 10 : 2) : 1;
  }
  markLessonDone(it._lesson, it._course);
  save();
}

/* ---------- lessons and sessions ---------- */
let run = null;
function show(id) {
  ['#lesson', '#result'].forEach(s => $(s).hidden = s !== id);
  document.body.classList.toggle('in-lesson', id !== null);
}
function newRun(extra) { return { graded: new Set(), xp: 0, reviewed: 0, remembered: 0, newSeen: 0, correct: 0, wrong: new Set(), cur: null, sel: null, phase: 'answer', ...extra }; }
function startLesson(i, challenge) {
  const L = LESSONS[i];
  run = newRun({ mode: 'lesson', challenge: challenge || null, idx: i, hearts: 5, total: L.items.length,
    queue: L.items.map((it, k) => ({ ...it, key: k, _card: cardId(L.id, k), _course: state.course, _lesson: L.id })) });
  show('#lesson');
  nextItem();
}
function startSession(extra) {
  const today = dstr(new Date());
  const due = dueCards(today).slice(0, SESSION_REVIEWS);
  const fresh = newCardsAvailable().slice(0, extra ? SESSION_NEW : newAllowanceToday(today));
  const cards = due.concat(fresh);
  if (!cards.length) { toast('Nothing to review right now.'); return; }
  run = newRun({ mode: 'session', hearts: Infinity, total: cards.length,
    queue: cards.map((c, k) => ({ ...c.item, key: k, _card: c.id, _course: c.course, _lesson: c.lessonId, _new: !state.srs[c.id] })) });
  show('#lesson');
  nextItem();
}
function goHome() { run = null; show(null); if (pendingCourses) { const p = pendingCourses; pendingCourses = null; installCourses(p); } renderHome(); window.scrollTo(0, 0); }
$('#quitBtn').onclick = goHome;

function updateBar() {
  $('#prog').style.width = (run.correct / run.total * 100) + '%';
  $('.lbar .stat.hearts').hidden = !isFinite(run.hearts);
  $('#hearts').textContent = run.hearts;
}
function setCheck(visible, enabled, label) { const b = $('#checkBtn'); b.hidden = !visible; b.disabled = !enabled; b.textContent = label || 'Check'; }
function resetFoot() { $('#foot').className = 'lfoot'; const fb = $('#fb'); fb.hidden = true; fb.className = 'fb'; fb.innerHTML = ''; }

function nextItem() {
  resetFoot();
  if (!run.queue.length) return finish();
  run.cur = run.queue.shift(); run.sel = null; run.phase = 'answer';
  updateBar();
  const it = run.cur;
  if (it.t === 'recall' && it._retry) it._noAI = true;
  // Typed answers are the default for every multiple-choice question; "Show choices" switches one card back. Retries after a miss use choices.
  const typed = it.t === 'recall' || (it.t === 'mc' && !it._retry && !it._choices);
  if (typed) renderTyped(it); else if (it.t === 'mc') renderMC(it); else if (it.t === 'match') renderMatch(it); else renderOrder(it);
  if (run.mode === 'session') $('#stage').insertAdjacentHTML('afterbegin', `<p class="cardtag">${it._new ? 'New' : 'Review'} · ${esc((COURSES[it._course] || {}).name || '')}</p>`);
  $('#stageWrap').scrollTop = 0;
}

function quoteHTML(it) {
  const sp = spk(it);
  return `<div class="speaker"><div class="avatar" aria-hidden="true">${sp.n[0]}</div><div class="bubble"><q>${esc(it.q)}</q><div class="who">${esc(sp.n)}, ${esc(sp.r)}</div></div></div>`;
}

function renderMC(it) {
  it._opts = shuffle(it.o.map((text, i) => ({ text, right: i === it.a, i })));
  const kicker = it.predict ? 'Make a prediction' : it.news ? 'Spot the procedure' : it.q ? 'Decode the staffer' : 'Choose the best answer';
  $('#stage').innerHTML = `<p class="kicker">${kicker}</p>${newsHTML(it)}<h3 class="prompt">${esc(it.p || 'What does this most likely mean?')}</h3>${it.q ? quoteHTML(it) : ''}<div class="opts" role="radiogroup">${it._opts.map((o, i) => `<button class="opt" role="radio" aria-checked="false" data-i="${i}"><span class="kbd">${i + 1}</span><span>${esc(o.text)}</span></button>`).join('')}</div>`;
  $('#stage').querySelectorAll('.opt').forEach(b => b.onclick = () => pickMC(+b.dataset.i));

}
function pickMC(i) {

}

function renderMatch(it) {
  const L = shuffle(it.pairs.map((p, i) => ({ t: p[0], i })));

  $('#stage').innerHTML = `<p class="kicker">Match the pairs</p><h3 class="prompt">${esc(it.p)}</h3><div class="match"><div class="col">${L.map(x => `<button class="tile term" data-s="l" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div><div class="col">${R.map(x => `<button class="tile" data-s="r" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
  run.m = { l: null, r: null, left: it.pairs.length, misses: 0 };
  $('#stage').querySelectorAll('.tile').forEach(b => b.onclick = () => pickTile(b));

}
function pickTile(b) {

  if (run.m[side] === b) { run.m[side] = null; return; }
  b.classList.add('sel'); run.m[side] = b;
  const { l, r } = run.m;
  if (!l || !r) return;
  if (l.dataset.i === r.dataset.i) {
    [l, r].forEach(x => { x.classList.remove('sel'); x.classList.add('matched'); x.disabled = true; });
    run.m.left--;
    if (run.m.left === 0) setTimeout(() => {
      grade(true, '', run.m.misses ? `Matched, with ${run.m.misses} miss${run.m.misses > 1 ? 'es' : ''}.` : null, run.m.misses ? 2 : 3);
    }, 300);
  } else {
    run.m.misses++; run.wrong.add(run.cur.key);
    [l, r].forEach(x => { x.classList.remove('sel'); x.classList.add('miss'); setTimeout(() => x.classList.remove('miss'), 450); });
  }
  run.m.l = null; run.m.r = null;
}

function renderOrder(it) {
  if (!run.pool || run.poolFor !== it) { run.pool = shuffle(it.items.map((_, i) => i)); run.ans = []; run.poolFor = it; }
  const slots = it.items.map((_, k) => `<li>${run.ans[k] !== undefined ? `<button class="chip" data-a="${k}">${esc(it.items[run.ans[k]])}</button>` : '<span class="empty"></span>'}</li>`).join('');
  const pool = run.pool.filter(i => !run.ans.includes(i)).map(i => `<button class="chip" data-p="${i}">${esc(it.items[i])}</button>`).join('');
  $('#stage').innerHTML = `<p class="kicker">Put them in order</p><h3 class="prompt">${esc(it.p)}</h3><div class="order"><div class="end">${esc(it.ends[0])}</div><ol class="slots">${slots}</ol><div class="end">${esc(it.ends[1])}</div></div><div class="pool">${pool || '<span class="end">All placed. Tap one above to take it back.</span>'}</div>`;
  $('#stage').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { if (run.phase !== 'answer') return; run.ans.push(+b.dataset.p); renderOrder(it); });
  $('#stage').querySelectorAll('[data-a]').forEach(b => b.onclick = () => { if (run.phase !== 'answer') return; run.ans.splice(+b.dataset.a, 1); renderOrder(it); });
  setCheck(true, run.ans.length === it.items.length);
  if (run.mode === 'session' && !$('#stage .cardtag')) $('#stage').insertAdjacentHTML('afterbegin', `<p class="cardtag">${it._new ? 'New' : 'Review'} · ${esc((COURSES[it._course] || {}).name || '')}</p>`);
}

function check() {
  const it = run.cur;
  if (it.t === 'mc') {
    if (run.sel === null) return;
    const pick = it._opts[run.sel], ok = pick.right;
    $('#stage').querySelectorAll('.opt').forEach((b, k) => {
      b.disabled = true; b.classList.remove('sel');
      if (it._opts[k].right) b.classList.add('right'); else if (k === run.sel) b.classList.add('wrong');
    });
    const whyNot = !ok && it.ow && it.ow[pick.i] ? `<p class="whynot"><span>Why not that one</span>${esc(it.ow[pick.i])}</p>` : '';
    grade(ok, ok ? '' : `<p class="ans">${it.predict ? 'What happened' : 'Better answer'}: ${esc(it.o[it.a])}</p>${whyNot}`);
  } else if (it.t === 'order') {
    const ok = run.ans.every((v, i) => v === i);

}

function reportHTML(it) { return (COURSES[it._course] || {}).group && G ? '<div class="repbox"><button class="linkbtn" id="repBtn">Report a problem</button></div>' : ''; }
function newsHTML(it) { return it.news ? `<div class="news"><span class="news-k">In the news</span><p class="news-h">${esc(it.news.h)}</p><span class="news-d">${esc(it.news.d)} · paraphrased</span></div>` : ''; }

/* ---------- typed answers: confidence first, then an AI grade (or a self-grade fallback) ---------- */
const CONF = [['guess', 'Guessing'], ['sure', 'Fairly sure'], ['cold', 'Knew it']];
const typedAnswerOf = it => it.t === 'recall' ? it.answer : it.o[it.a];
// Answer score (0 to 3) plus confidence becomes an FSRS grade. Right answers that were guesses come back sooner.
const fsrsFrom = (score, conf) => score === 0 ? 1 : score === 1 ? 2 : score === 2 ? (conf === 'guess' ? 2 : 3) : (conf === 'cold' ? 4 : 3);
function renderTyped(it) {
  const fresh = !state.srs[it._card];
  $('#stage').innerHTML = `<p class="kicker">${it.predict ? 'Make a prediction' : fresh ? 'Take your best shot' : 'From memory'}</p>${newsHTML(it)}<h3 class="prompt">${esc(it.p || 'What does this most likely mean?')}</h3>${it.q ? quoteHTML(it) : ''}
    <div class="hintbox" id="hintBox" hidden></div>
    <textarea class="recall-in" id="recallIn" rows="3" placeholder="Answer in a few words or a sentence."></textarea>
    <div class="conf"><div class="conf-btns"><button class="btn sm" data-conf="sure">Check answer</button></div><div class="conf-alt"><button class="linkbtn" id="hintBtn">Give me a hint</button>${it.t === 'mc' ? '<button class="linkbtn" id="showChoices">Show choices instead</button>' : ''}<button class="linkbtn" data-conf="none">I don’t know</button></div></div>`;
  setCheck(false, false);
  setTimeout(() => { const x = $('#recallIn'); if (x) x.focus(); }, 30);
}
async function submitTyped(conf) {
  if (!run || run.phase !== 'answer') return;
  const it = run.cur, text = ($('#recallIn').value || '').trim();
  if (conf !== 'none' && !text) { toast('Type an answer first, or tap “I don’t know”.'); return; }
  run.phase = 'grading'; it._conf = conf; it._resp = text;
  $('#recallIn').disabled = true; $('#stage').querySelectorAll('[data-conf]').forEach(b => b.disabled = true);
  if (conf === 'none') return showTyped(it, 0, '', 'guess', 'none');
  // Show the model answer and explanation right away; the grade fills in above them when it arrives.
  const fb = $('#fb'); fb.hidden = false; fb.className = 'fb';
  fb.innerHTML = `<p class="checking"><span class="spin" aria-hidden="true"></span>Grading your answer…</p><div class="recall-ans"><span>${it.open ? 'Some good answers' : 'Model answer'}</span><p>${esc(typedAnswerOf(it))}</p></div><p>${esc(it.x)}</p>`;
  if (!it._noAI) {
    try {
      const r = await apiCall('/api/grade', { question: [it.p, it.q].filter(Boolean).join(' '), answer: typedAnswerOf(it), keys: it.keys || [], explain: it.x || '', response: text, open: it.open === true, accepted: (state.accepted || {})[it._card] || [] });
      if (run && run.cur === it) showTyped(it, r.score, r.feedback, conf, 'ai', r);
      return;
    } catch (e) { if (run && run.cur === it) selfGrade(it, conf, e instanceof TypeError ? 'Couldn’t reach the grader.' : e.message); return; }
  }
  selfGrade(it, conf, '');
}

// Hints: the course's own hint if it has one, then a cached or AI-written nudge, then a fallback that narrows the choices.
async function showHint(it) {
  const box = $('#hintBox'), btn = $('#hintBtn');
  if (!box || it._hinted) return;
  it._hinted = true; btn.disabled = true; box.hidden = false; box.innerHTML = '<p>Thinking of a hint…</p>';
  const put = t => { if (run && run.cur === it) box.innerHTML = `<span>Hint</span><p>${esc(t)}</p>`; };
  if (it.hint) return put(it.hint);
  if (state.hints[it._card]) return put(state.hints[it._card]);
  {
    try {
      const r = await apiCall('/api/hint', { question: [it.p, it.q].filter(Boolean).join(' '), answer: typedAnswerOf(it), keys: it.keys || [] });
      state.hints[it._card] = r.hint; save(); return put(r.hint);
    } catch (e) { /* fall through to the offline hint */ }
  }
  if (it.t === 'mc') {
    const wrong = it.o.filter((_, i) => i !== it.a);
    const pair = shuffle([it.o[it.a], wrong[Math.floor(Math.random() * wrong.length)]]);
    return put(`It’s one of these: “${pair[0]}” or “${pair[1]}”.`);
  }
  const words = String(it.answer).split(/\s+/);
  put(`It starts: “${words.slice(0, Math.min(3, Math.ceil(words.length / 4))).join(' ')}…”`);
}
function selfGrade(it, conf, note) {
  run.phase = 'selfgrade'; run.selfConf = conf;
  const fb = $('#fb'); fb.hidden = false; fb.className = 'fb';
  fb.innerHTML = `${note ? `<p class="meta">${esc(note)}</p>` : ''}<div class="recall-ans"><span>${it.open ? 'Some good answers' : 'Model answer'}</span><p>${esc(typedAnswerOf(it))}</p></div><p class="gq">How close was yours?</p><div class="grades">${[[0, 'Missed it'], [1, 'Partly'], [2, 'Mostly'], [3, 'Fully']].map(([n, t], i) => `<button class="gbtn" data-self="${n}"><span class="kbd">${i + 1}</span><b>${t}</b></button>`).join('')}</div>`;
}
// Percent-scored AI grades map straight to a review grade; self-grades use the 0 to 3 score.
const fsrsFromPct = p => p < 25 ? 1 : p < 55 ? 2 : p < 95 ? 3 : 4;
const VERDICT = { right: ['ok', 'Right'], partly: ['part', 'Partly'], wrong: ['no', 'Not right'], unsure: ['unsure', 'Can’t confirm'] };
function pointsHTML(d) {
  if (!d || !Array.isArray(d.points)) return '';
  const pts = d.points.length ? `<ul class="gpts">${d.points.map(pt => { const v = VERDICT[pt.verdict] || VERDICT.unsure; return `<li class="v-${v[0]}"><span class="gv">${v[1]}</span><b>${esc(pt.said)}</b><span>${esc(pt.note)}</span></li>`; }).join('')}</ul>` : '';
  const miss = d.missed && d.missed.length ? `<div class="gmiss"><span>Also worth knowing</span><ul>${d.missed.map(m => `<li>${esc(m)}</li>`).join('')}</ul></div>` : '';
  return pts + miss;
}
function showTyped(it, score, feedback, conf, source, detail) {
  run.phase = 'feedback'; it._detail = detail || null;
  it._snap = { prev: state.srs[it._card], graded: run.graded.has(it._card), xp: run.xp, reviewed: run.reviewed, remembered: run.remembered, newSeen: run.newSeen, newCount: state.newCount, correct: run.correct, qlen: run.queue.length, wrongHad: run.wrong.has(it.key) };
  const pct = detail && Number.isFinite(detail.percent) ? detail.percent : null;
  const g = pct !== null ? fsrsFromPct(pct) : fsrsFrom(score, conf);
  srsRecord(it, it._hinted ? Math.min(2, g) : g);
  if (state.srs[it._card]) { state.srs[it._card].miss = conf === 'cold' && score === 0; save(); }
  run.correct++;
  if (score <= 1) run.wrong.add(it.key);
  if (score === 0) { run.correct--; run.queue.push({ ...it, _retry: true }); }
  updateBar();
  const ok = score >= 2;
  $('#foot').className = 'lfoot ' + (ok ? 'good' : 'bad');
  const fb = $('#fb'); fb.hidden = false; fb.className = 'fb';
  const heads = ['Not quite.', 'Partly there.', 'Mostly right.', 'Exactly right.'];
  fb.innerHTML = `<h4>${ok ? ICON.ok : ICON.no}${pct !== null ? `<span class="gpct">${pct}%</span>` : ''}${heads[score]}</h4>${detail && detail.reply ? `<div class="second"><span>Second opinion from a stronger grader</span><p>${esc(detail.reply)}</p></div>` : ''}${source === 'ai' && feedback ? `<p class="aifb">${esc(feedback)}</p>` : ''}${source === 'ai' ? pointsHTML(detail) : ''}<div class="recall-ans"><span>${it.open ? 'Some good answers' : 'Model answer'}</span><p>${esc(typedAnswerOf(it))}</p></div><p>${esc(it.x)}</p>${it._hinted && score >= 2 ? '<p class="meta">You used a hint, so this one comes back a little sooner.</p>' : ''}${conf === 'cold' && score === 0 ? '<p class="whynot"><span>Confident miss</span>You were sure about this one, so it comes back tomorrow. These are the mistakes most worth fixing.</p>' : ''}${source === 'ai' ? `<p class="meta" id="gradeMeta">${detail && detail.reply ? 'Re-graded by a stronger AI.' : 'Graded by AI.'} ${detail && detail.reply ? '' : '<button class="linkbtn" id="dispute">I think the grader is wrong</button> '}<button class="linkbtn" id="regrade">Grade it myself</button></p>` : ''}${reportHTML(it)}`;
  const b = $('#checkBtn'); b.hidden = false; b.disabled = false; b.textContent = 'Continue'; b.focus({ preventScroll: true });
}
// Undo an AI grade so the learner can grade the same answer themselves.
function undoTyped(it) {
  const sn = it._snap; if (!sn) return;
  if (sn.prev) state.srs[it._card] = sn.prev; else delete state.srs[it._card];
  if (!sn.graded) run.graded.delete(it._card);
  Object.assign(run, { xp: sn.xp, reviewed: sn.reviewed, remembered: sn.remembered, newSeen: sn.newSeen, correct: sn.correct });
  state.newCount = sn.newCount; run.queue.length = sn.qlen;
  if (!sn.wrongHad) run.wrong.delete(it.key);
  save(); updateBar();
}
$('#stage').addEventListener('click', e => {
  if (!run) return;
  if (e.target.closest('#hintBtn') && run.phase === 'answer') { showHint(run.cur); return; }
  if (e.target.closest('#showChoices') && run.phase === 'answer') { run.cur._choices = true; renderMC(run.cur); if (run.mode === 'session') $('#stage').insertAdjacentHTML('afterbegin', `<p class="cardtag">${run.cur._new ? 'New' : 'Review'} · ${esc((COURSES[run.cur._course] || {}).name || '')}</p>`); return; }
  const b = e.target.closest('[data-conf]'); if (b) submitTyped(b.dataset.conf);
});
$('#fb').addEventListener('click', e => {
  if (!run) return;
  const sb = e.target.closest('[data-self]');
  if (sb && run.phase === 'selfgrade') { showTyped(run.cur, +sb.dataset.self, '', run.selfConf || 'sure', 'self'); return; }
  if (e.target.closest('#regrade') && run.phase === 'feedback') { const it = run.cur; const conf = run.selfConf; undoTyped(it); $('#foot').className = 'lfoot'; selfGrade(it, it._conf || 'sure', ''); }
});
// "I think the grader is wrong": collect an optional note, get a second opinion from a stronger model, and replace the grade.
$('#fb').addEventListener('click', async e => {
  if (!run || run.phase !== 'feedback') return;
  const it = run.cur;
  if (e.target.closest('#dispute')) {
    $('#gradeMeta').outerHTML = `<div class="repbox" id="dispBox"><label class="gq" for="dispNote">Why do you think the grader is wrong?</label><textarea id="dispNote" rows="3" maxlength="800" placeholder="For example: my second policy is real (say where it comes from), or the grader misread what I said."></textarea><div class="row"><button class="btn ghost sm" id="dispSend">Get a second opinion</button></div><p class="meta">Your answer and note are saved so the course and grader can be improved.</p></div>`;
    $('#dispNote').focus(); return;
  }
  if (e.target.closest('#dispSend')) {
    const note = ($('#dispNote').value || '').trim();
    if (note.length < 10) { toast('Say briefly why you think the grade is wrong. The second grader uses it.'); $('#dispNote').focus(); return; }
    $('#dispBox').innerHTML = '<p class="checking"><span class="spin" aria-hidden="true"></span>Getting a second opinion…</p>';
    run.phase = 'disputing';
    try {
      const r = await apiCall('/api/dispute', { question: [it.p, it.q].filter(Boolean).join(' '), answer: typedAnswerOf(it), keys: it.keys || [], explain: it.x || '', response: it._resp || '', open: it.open === true, first: it._detail, note, course: it._course || '', card: it._card || '' });
      if (!run || run.cur !== it) return;
      // Remember answers accepted on appeal so the grader credits the same point next time this card comes up.
      if (r.outcome === 'upheld' || r.outcome === 'partly_upheld') { state.accepted = state.accepted || {}; state.accepted[it._card] = [...(state.accepted[it._card] || []), { r: String(it._resp || '').slice(0, 400), why: String(r.reply || '').slice(0, 300) }].slice(-3); save(); }
      undoTyped(it); showTyped(it, r.score, r.feedback, it._conf || 'sure', 'ai', r);
    } catch (err) {
      if (!run || run.cur !== it) return;
      run.phase = 'feedback';
      const box = $('#dispBox'); if (box) box.innerHTML = `<p class="meta">${esc(err instanceof TypeError ? 'Couldn’t reach the grader.' : err.message)}</p>`;
    }
  }
});

// srsGrade defaults to good (3) when correct and missed (1) when wrong; matching with misses passes 2.
function grade(ok, ansHTML, heading, srsGrade) {
  const it = run.cur;
  run.phase = 'feedback';
  srsRecord(it, srsGrade || (ok ? 3 : 1));
  if (ok) run.correct++;
  else { run.hearts--; run.wrong.add(it.key); run.queue.push(it); }
  updateBar();
  const foot = $('#foot'); foot.className = 'lfoot ' + (ok ? 'good' : 'bad');
  const fb = $('#fb'); fb.hidden = false; fb.className = 'fb';
  const head = heading || (it.predict ? (ok ? 'Good call.' : 'Here’s what happened.') : ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : 'Not quite.');
  fb.innerHTML = `<h4>${ok ? ICON.ok : ICON.no}${esc(head)}</h4>${ansHTML || ''}<p>${esc(it.x)}</p>${it.ask ? `<p class="ask"><span>Try asking</span>${esc(it.ask)}</p>` : ''}${reportHTML(it)}`;
  const b = $('#checkBtn'); b.hidden = false; b.disabled = false; b.textContent = 'Continue'; b.focus({ preventScroll: true });
}

$('#checkBtn').onclick = () => {
  if (!run) return;
  if (run.phase === 'feedback') { if (run.hearts <= 0) return fail(); nextItem(); }
  else if (run.phase === 'answer') check();
};

function bumpStreak() {
  const today = dstr(new Date());
  if (!state.activeDays.includes(today)) state.activeDays.push(today);

}
function streakInfo() { return computeStreak(state.activeDays, state.settings, dstr(new Date())); }
function finish() {
  bumpStreak();
  if (run.mode === 'session') return finishSession();
  const L = LESSONS[run.idx];
  state.done[L.id] = true;
  run.xp += 10;
  state.xp += run.xp; save();
  const firstTry = run.total - run.wrong.size;
  const acc = Math.round(firstTry / run.total * 100);
  groupPost(L, run.xp, acc);
  const nextL = LESSONS[run.idx + 1];
  $('#result').classList.remove('failed');
  $('#resultIn').innerHTML = `${ICON.seal}<h2>${acc === 100 ? 'Clean sweep.' : 'Lesson complete.'}</h2><p>${esc(L.title)}${nextL ? '. Up next: ' + esc(nextL.title) + '.' : '. That was the last lesson on the path.'} These questions will come back in your daily reviews.</p><div class="rtiles"><div class="rtile"><span class="k">XP</span><span class="v">+${run.xp}</span></div><div class="rtile acc"><span class="k">First try</span><span class="v">${acc}%</span></div><div class="rtile st"><span class="k">Streak</span><span class="v">${state.streak}d</span></div></div>${groupLine(acc)}<div class="rbtns"><button class="btn" id="rHome">Continue</button></div>`;

function finishSession() {

  groupPostSession(run.xp, acc, run.reviewed, run.newSeen);

async function apiCall(path, bodyObj) {

  const f = e.target.files[0];

  f.text().then(txt => { $('#addText').value = txt; runCheck(); });
});

$('#cinfo').addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const C = COURSES[state.course];
  if (t.id === 'ciUpdate') openAdd();
  if (t.id === 'ciReports') openReports(C);
  if (t.id === 'ciDelete') {
    if (t.dataset.armed !== '1') { t.dataset.armed = '1'; t.textContent = 'Click again to remove it for everyone'; setTimeout(() => { if (t.isConnected) { t.dataset.armed = ''; t.textContent = 'Remove course'; } }, 4000); return; }
    try { await apiCall('/api/courses/' + C.slug + '/delete', {}); toast('Course removed.'); state.course = null; save(); await loadCourses(); }
    catch (err) { toast(err.message); }
  }
});

async function openReports(C) {
  openSheet('#repv'); $('#repBody').innerHTML = '<p>Loading…</p>';
  try {
    const d = await apiCall('/api/courses/' + C.slug + '/reports');
    const lessonName = id => { const l = LESSONS.find(x => x.id === id); return l ? l.title : 'A lesson'; };
    $('#repBody').innerHTML = d.reports.length ? `<p class="kicker">${esc(C.name)}</p><ul class="replist">${d.reports.map(r => `<li><div class="meta">${esc(lessonName(r.lessonId))} · from ${esc(r.by)} · ${ago(r.at)}${r.version !== C.version ? ` · on version ${r.version}` : ''}</div><div class="rq">${esc(r.itemText)}</div><div class="rn">${esc(r.note)}</div><div class="row"><button class="btn ghost sm" data-resolve="${r.id}">Mark fixed</button></div></li>`).join('')}</ul><p>To fix something, give these notes to your Claude along with your course file, then upload the new version.</p>` : '<p>No open reports.</p>';
  } catch (err) { $('#repBody').innerHTML = `<p class="gerr">${netMsg(err)}</p>`; }
}
$('#repBody').addEventListener('click', async e => {
  const t = e.target.closest('[data-resolve]'); if (!t) return;
  try { await apiCall('/api/reports/' + t.dataset.resolve + '/resolve', {}); t.closest('li').remove(); const C = COURSES[state.course]; if (C) C.openReports = Math.max(0, C.openReports - 1); renderHome(); }
  catch (err) { toast(err.message); }
});

$('#fb').addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t || !run) return;
  const C = COURSES[state.course];
  if (t.id === 'repBtn') { t.parentElement.innerHTML = '<textarea id="repNote" rows="2" maxlength="500" placeholder="What’s wrong? Include a source if you have one."></textarea><div class="row"><button class="btn ghost sm" id="repSend">Send report</button></div>'; $('#repNote').focus(); }
  if (t.id === 'repSend') {
    const note = $('#repNote').value.trim(); if (!note) return;
    const it = run.cur;
    try { await apiCall('/api/courses/' + C.slug + '/reports', { lessonId: LESSONS[run.idx].id, itemText: it.q || it.p || '', note }); t.closest('.repbox').innerHTML = '<p>Thanks. The author will see it.</p>'; }
    catch (err) { toast(err.message); }
  }
});

/* ---------- course picker and welcome ---------- */
function courseProgress(key) {
  const C = COURSES[key]; if (!C) return { done: 0, total: 0 };
  let total = 0, done = 0;
  C.units.forEach((u, ui) => u.lessons.forEach((l, li) => { total++; if (state.done[C.pre + 'u' + ui + 'l' + li]) done++; }));
  return { done, total };
}
function welcomeHTML() {
  return `<section class="welcome"><p class="kicker">Welcome to WonkoLingo</p><h2>Learn anything with your friends</h2>
    <p>Pick any topic. Your AI assistant turns it into a bite-size course in a few minutes. Then you and your friends play each other’s courses and compete on streaks and points.</p>
    <ol class="steps"><li><span><b>Start a group</b> and invite friends, or just use it yourself.</span></li><li><span><b>Make a course</b> by pasting our prompt into Claude or another AI assistant.</span></li><li><span><b>Play and compete</b> on your group’s weekly leaderboard.</span></li></ol>
    <div class="row"><button class="btn" id="wCreate">Create your first course</button><button class="btn ghost" id="wBrowse">Try an example course</button></div></section>`;
}
function selectCourse(key) {
  state.course = key; save(); buildLessons(); renderHome(); renderPotd(); window.scrollTo(0, 0);
}
let pickQ = '';
function renderPick() {
  const keys = Object.keys(COURSES);
  const q = pickQ.trim().toLowerCase();
  const match = k => !q || (COURSES[k].name + ' ' + (COURSES[k].author || '') + ' ' + (COURSES[k].description || '')).toLowerCase().includes(q);
  const item = k => {
    const C = COURSES[k], pr = courseProgress(k);
    const sub = C.group ? (G && C.authorId === G.player.id ? 'By you' : 'By ' + C.author) : 'Example course';
    const pct = pr.total ? Math.round(pr.done / pr.total * 100) : 0;
    return `<button class="pk-item${k === state.course ? ' on' : ''}" data-course="${esc(k)}"><span class="t">${esc(C.name)}</span><span class="n">${pr.done === pr.total && pr.total ? 'Done' : pr.done ? pr.done + ' of ' + pr.total : pr.total + ' lessons'}<span class="bar-mini"><i style="width:${pct}%"></i></span></span><span class="s">${esc(sub)}${C.description ? ' · ' + esc(C.description) : ''}</span></button>`;
  };
  const started = k => courseProgress(k).done > 0 ? 0 : 1;
  const sortK = (a, b) => started(a) - started(b) || COURSES[a].name.localeCompare(COURSES[b].name);
  const mine = keys.filter(k => COURSES[k].group && G && COURSES[k].authorId === G.player.id && match(k)).sort(sortK);
  const group = keys.filter(k => COURSES[k].group && !(G && COURSES[k].authorId === G.player.id) && match(k)).sort(sortK);
  const builtin = keys.filter(k => !COURSES[k].group && match(k));
  let h = `<div class="row"><button class="btn sm" id="pkCreate">+ Create a course</button></div>`;
  if (keys.length > 6) h += `<input class="pk-search" id="pickQ" type="search" placeholder="Search courses" value="${esc(pickQ)}" autocomplete="off">`;
  h += `<div class="pk-sec"><h4>Your courses</h4>${mine.length ? mine.map(item).join('') : q ? '<p>No matches.</p>' : `<div class="pk-empty"><p>You haven’t made a course yet. Pick a topic you want to learn or teach, and your AI assistant can draft one in a few minutes.</p><div class="row"><button class="btn ghost sm" id="pkCreate2">Make one</button></div></div>`}</div>`;
  if (G) h += `<div class="pk-sec"><h4>From ${esc(G.groupName)}</h4>${group.length ? group.map(item).join('') : `<p>${q ? 'No matches.' : 'Nobody else in your group has shared a course yet.'}</p>`}</div>`;
  if (builtin.length) h += `<div class="pk-sec"><h4>Example courses</h4>${builtin.map(item).join('')}</div>`;
  $('#pickBody').innerHTML = h;
}
function openPicker() { pickQ = ''; renderPick(); openSheet('#pick'); }
$('#pickWrap').addEventListener('click', e => { if (e.target.closest('#pickBtn')) openPicker(); });
$('#path').addEventListener('click', e => {
  if (e.target.closest('#wCreate')) openAdd();
  if (e.target.closest('#wBrowse')) openPicker();
});
$('#pickBody').addEventListener('click', e => {
  if (e.target.closest('#pkCreate, #pkCreate2')) { closeSheet('#pick'); openAdd(); return; }
  const b = e.target.closest('[data-course]'); if (!b) return;
  closeSheet('#pick'); selectCourse(b.dataset.course);
});
$('#pickBody').addEventListener('input', e => {
  if (e.target.id !== 'pickQ') return;
  pickQ = e.target.value; const pos = e.target.selectionStart; renderPick();
  const inp = $('#pickQ'); inp.focus(); inp.setSelectionRange(pos, pos);
});

/* ---------- today: the daily session is the main thing ---------- */
function renderToday() {
  const el = $('#todayWrap'); if (!el) return;
  const today = dstr(new Date());
  const learned = Object.keys(state.srs).length;
  if (!learned && !COURSES[state.course]) { el.innerHTML = ''; return; }
  const due = dueCards(today).length, sessDue = Math.min(due, SESSION_REVIEWS);
  const avail = newCardsAvailable().length, nNew = Math.min(avail, newAllowanceToday(today));
  if (sessDue + nNew > 0) {
    const mins = Math.max(1, Math.round(sessDue * 0.6 + nNew * 0.4));
    const what = [sessDue ? `${sessDue} review${sessDue === 1 ? '' : 's'}` : '', nNew ? `${nNew} new` : ''].filter(Boolean).join(' · ');
    el.innerHTML = `<section class="today"><div class="today-main"><p class="kicker">Today</p><h2>${what}</h2><p>About ${mins} minute${mins === 1 ? '' : 's'}. You type answers from memory and AI grades them.${due > SESSION_REVIEWS ? ` ${due - SESSION_REVIEWS} more are waiting for later sessions.` : ''}</p></div><button class="btn" id="todayGo">Start</button></section>`;
  } else {
    const next = Object.values(state.srs).map(c => c.due).filter(d => d > today).sort()[0];
    el.innerHTML = `<section class="today done"><div class="today-main"><p class="kicker">Today</p><h2>All caught up</h2><p>${next ? 'Your next reviews are due ' + whenText(next) + '.' : ''}${avail ? ' You can learn more now if you want.' : ''}</p></div>${avail ? '<button class="btn ghost" id="todayMore">Learn 5 more</button>' : ''}</section>`;
  }
}
$('#todayWrap').addEventListener('click', e => {
  if (e.target.closest('#todayGo')) startSession(false);
  if (e.target.closest('#todayMore')) startSession(true);
});
function groupPostSession(xp, acc, reviewed, fresh) {
  if (!G || !xp) return;
  const title = reviewed ? `today’s review (${reviewed} card${reviewed === 1 ? '' : 's'})` : `${fresh} new card${fresh === 1 ? '' : 's'}`;
  apiCall('/api/complete', { lessonId: 'review-' + Date.now(), title, xp, acc, day: dstr(new Date()) }).then(refreshBoard, () => { gOffline = true; renderGroup(); });
}

/* ---------- streak card and settings ---------- */
function flameSVG(cls) { return `<svg class="${cls || ''}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.5 2c.6 3.4 4.9 5.6 4.9 10.6A5.4 5.4 0 0 1 12 18a5.4 5.4 0 0 1-5.4-5.4c0-2.4 1.2-4 2.4-5 0 2 .9 3.2 2 3.4-.3-3.3.5-6.4 1.5-9z"/></svg>`; }
function snowSVG() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 4l3 2 3-2M9 20l3-2 3 2M4 10.5l3.5-.3-1.4-3.2M20 13.5l-3.5.3 1.4 3.2M4 13.5l3.5.3-1.4 3.2M20 10.5l-3.5-.3 1.4-3.2"/></svg>'; }
function schedText(days) { return days.every(Boolean) ? 'every day' : days.join() === WEEKDAYS.join() ? 'weekdays' : days.map((v, i) => v ? DOW[i] : null).filter(Boolean).join(', '); }
function currentPause(today) { return (state.settings.pauses || []).find(p => today >= p.from && (!p.to || today <= p.to)); }
function renderStreakCard() {
  const el = $('#streakCard'); if (!el) return;
  const si = streakInfo(), today = dstr(new Date());
  let status = si.doneToday ? 'Done for today.' : si.pausedNow ? 'Paused. Missed days won’t count against you.' : si.offToday ? 'Today is an off day.' : si.streak ? 'Practice today to keep it going.' : 'Finish a session to start a streak.';
  if (si.frozen.includes(addDays(today, -1))) status = 'A freeze covered yesterday. ' + status;
  const flakes = Array.from({ length: STREAK_RULES.maxFreezes }, (_, i) => `<span class="flake${i < si.freezes ? ' on' : ''}">${snowSVG()}</span>`).join('');
  el.innerHTML = `<div class="ghead"><h3>Streak</h3><button class="linkbtn" id="streakSet">Settings</button></div>
    <div class="sk-row${si.atRisk ? ' risk' : ''}">${flameSVG('sk-f')}<span class="sk-n">${si.streak}</span><span class="sk-d">day${si.streak === 1 ? '' : 's'}</span></div>
    <p>${esc(status)}</p>
    <div class="kv"><span>Streak freezes</span><span class="flakes" title="${si.freezes} of ${STREAK_RULES.maxFreezes}">${flakes}</span></div>
    <p class="meta">${si.freezes >= STREAK_RULES.maxFreezes ? 'Freezes full.' : `Next freeze after ${si.toNextFreeze} more practice day${si.toNextFreeze === 1 ? '' : 's'}.`} Counts ${schedText(state.settings.days)}${si.pausedNow ? ', paused now' : ''}. Best: ${si.best}.</p>`;
}
function renderStreakSheet() {
  const st = state.settings, today = dstr(new Date()), pz = currentPause(today);
  const preset = st.days.every(Boolean) ? 'all' : st.days.join() === WEEKDAYS.join() ? 'week' : 'custom';
  $('#streakBody').innerHTML = `<p>Your streak only counts the days you pick, and it never breaks on off days or while paused. A missed counting day uses a streak freeze automatically if you have one. You earn a freeze for every ${STREAK_RULES.freezeEvery} days you practice, and can hold up to ${STREAK_RULES.maxFreezes}.</p>
    <p class="kicker">Which days count</p>
    <div class="seg"><button data-preset="all" class="${preset === 'all' ? 'on' : ''}">Every day</button><button data-preset="week" class="${preset === 'week' ? 'on' : ''}">Weekdays</button><button data-preset="custom" class="${preset === 'custom' ? 'on' : ''}">Custom</button></div>
    <div class="days">${DOW.map((d, i) => `<button class="dayt${st.days[i] ? ' on' : ''}" data-dow="${i}" aria-pressed="${st.days[i]}">${d}</button>`).join('')}</div>
    <p class="kicker">Pause</p>
    ${pz ? `<p>Paused since ${esc(pz.from)}${pz.to ? ', until ' + esc(pz.to) : ' until you resume'}.</p><div class="row"><button class="btn sm" id="resumeBtn">Resume now</button></div>`
      : `<p>Going away or having a rough stretch? Pause and your streak waits for you.</p><div class="row">${[[3, '3 days'], [7, '1 week'], [14, '2 weeks'], ['open', 'Until I resume']].map(([n, t]) => `<button class="btn ghost sm" data-pause="${n}">${t}</button>`).join('')}</div>`}`;
}
function setStreakSettings(mutate) {
  mutate(state.settings); state.settingsAt = Date.now(); state.streak = streakInfo().streak;
  save(); renderStreakSheet(); renderHome();
}
$('#streakCard').addEventListener('click', e => { if (e.target.closest('#streakSet')) { renderStreakSheet(); openSheet('#streakSheet'); } });
$('#streakBody').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const today = dstr(new Date());
  if (t.dataset.preset === 'all') setStreakSettings(s => { s.days = [true, true, true, true, true, true, true]; });
  else if (t.dataset.preset === 'week') setStreakSettings(s => { s.days = WEEKDAYS.slice(); });
  else if (t.dataset.preset === 'custom') toast('Tap the days below to choose.');
  else if (t.dataset.dow !== undefined) {
    const i = +t.dataset.dow;
    if (state.settings.days[i] && state.settings.days.filter(Boolean).length === 1) { toast('At least one day has to count.'); return; }
    setStreakSettings(s => { s.days[i] = !s.days[i]; });
  } else if (t.dataset.pause) {
    const n = t.dataset.pause;
    setStreakSettings(s => { s.pauses = s.pauses || []; s.pauses.push({ from: today, to: n === 'open' ? null : addDays(today, +n - 1) }); });
    toast(n === 'open' ? 'Streak paused until you resume.' : 'Streak paused.');
  } else if (t.id === 'resumeBtn') {
    setStreakSettings(s => { s.pauses = (s.pauses || []).filter(p => !(today >= p.from && (!p.to || today <= p.to)) || p.from < today).map(p => (today >= p.from && (!p.to || today <= p.to)) ? { from: p.from, to: addDays(today, -1) } : p); });
    toast('Streak resumed.');
  }
});

/* ---------- sync progress to the server ---------- */
let syncTimer = null, syncBusy = false, syncAgain = false;
function syncPayload() { const { srs, done, jumped, activeDays, xp, settings, settingsAt, newDay, newCount, hints, accepted } = state; return { v: 1, srs, done, jumped, activeDays, xp, settings, settingsAt, newDay, newCount, hints, accepted }; }
// Merges another device's progress into this one: the most-reviewed copy of each card wins, practice days are combined.
function mergeStates(a, b) {
  const out = { ...a };
  const srs = { ...(b.srs || {}) };
  for (const [id, c] of Object.entries(a.srs || {})) { const o = srs[id]; if (!o || (c.reps || 0) > (o.reps || 0) || ((c.reps || 0) === (o.reps || 0) && c.last > o.last)) srs[id] = c; }
  out.srs = srs;
  out.done = { ...(b.done || {}), ...(a.done || {}) };
  out.jumped = [...new Set([...(b.jumped || []), ...(a.jumped || [])])];
  out.activeDays = [...new Set([...(b.activeDays || []), ...(a.activeDays || [])])].sort();
  out.xp = Math.max(a.xp || 0, b.xp || 0);
  if ((b.settingsAt || 0) > (a.settingsAt || 0) && b.settings) { out.settings = b.settings; out.settingsAt = b.settingsAt; }
  if ((b.newDay || '') > (a.newDay || '')) { out.newDay = b.newDay; out.newCount = b.newCount; }
  else if (b.newDay === a.newDay) out.newCount = Math.max(a.newCount || 0, b.newCount || 0);
  out.hints = { ...(b.hints || {}), ...(a.hints || {}) };
  out.accepted = { ...(b.accepted || {}), ...(a.accepted || {}) };
  return out;
}
async function syncNow() {
  if (!G) return;
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true; clearTimeout(syncTimer);
  try {
    const r = await apiCall('/api/state');
    if (r.state) {
      const m = mergeStates(state, r.state);
      m.course = state.course; if (state.wantCourse) m.wantCourse = state.wantCourse;
      state = m;
    }
    state.streak = streakInfo().streak; save(true);
    await apiCall('/api/state', { state: syncPayload() });
    if (!run) renderHome();
  } catch (e) { /* offline: try again on the next change */ }
  finally { syncBusy = false; if (syncAgain) { syncAgain = false; scheduleSync(); } }
}
function scheduleSync() { if (!G) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 3000); }
document.addEventListener('visibilitychange', () => { if (document.hidden && G) syncNow(); });

refreshBoard();
loadCourses();
syncNow();
</script>
</body></html>
