<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Hill Speak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Source+Serif+4:ital,opsz,wght@1,8..60,500&display=swap">
<style>
/* Layout: sticky stat bar; zigzag lesson path under unit banners, beside a narrow side column; lessons open as a full-screen drill whose footer turns green or red on Check. */
:root {
  --bg: #f6f7fb; --surface: #ffffff; --fg: #162033; --muted: #5a6479; --line: #dbe0ea; --line-deep: #c3cad8;
  --primary: #2f5fd0; --primary-deep: #1e3f96; --primary-soft: #e4ecfd; --on-primary: #ffffff;
  --brass: #a8720c; --brass-soft: #fbf0d6;
  --good: #2f8a2a; --good-deep: #1f6a1b; --good-bg: #e3f4dc;
  --bad: #c93a32; --bad-deep: #9a2620; --bad-bg: #fbe4e2;
  --locked: #d3d9e3; --locked-deep: #b5bdcc; --locked-fg: #7d879a;
  --f-ui: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  --f-quote: "Source Serif 4", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1320; --surface: #171f31; --fg: #e6ebf5; --muted: #99a4ba; --line: #28324a; --line-deep: #344060;
  --primary: #7398f2; --primary-deep: #3d5fb8; --primary-soft: #1d2a4a; --on-primary: #0e1320;
  --brass: #e3ae49; --brass-soft: #3a2f17;
  --good: #6cc65e; --good-deep: #3f8f34; --good-bg: #18301c;
  --bad: #f2766d; --bad-deep: #b04640; --bad-bg: #3b1c1b;
  --locked: #2a3349; --locked-deep: #1f2638; --locked-fg: #6f7a91;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #171f31; --fg: #e6ebf5; --muted: #99a4ba; --line: #28324a; --line-deep: #344060;
  --primary: #7398f2; --primary-deep: #3d5fb8; --primary-soft: #1d2a4a; --on-primary: #0e1320;
  --brass: #e3ae49; --brass-soft: #3a2f17;
  --good: #6cc65e; --good-deep: #3f8f34; --good-bg: #18301c;
  --bad: #f2766d; --bad-deep: #b04640; --bad-bg: #3b1c1b;
  --locked: #2a3349; --locked-deep: #1f2638; --locked-fg: #6f7a91;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 16px; line-height: 1.45; font-weight: 600; }
body.in-lesson { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
svg { display: block; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 2px solid var(--line); }
.top-in { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 22px; letter-spacing: -0.01em; color: var(--primary); }
.brand svg { width: 30px; height: 30px; }
.stats { display: flex; gap: 18px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat { display: flex; align-items: center; gap: 6px; }
.stat svg { width: 22px; height: 22px; }
.stat.streak { color: var(--brass); }
.stat.xp { color: var(--primary); }
.stat.hearts { color: var(--bad); }

/* home */
.home { max-width: 1000px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
.path { display: grid; gap: 28px; min-width: 0; }
.unit { display: grid; gap: 20px; }
.banner { background: var(--primary); color: var(--on-primary); border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; box-shadow: 0 4px 0 var(--primary-deep); }
.unit.is-locked .banner { background: var(--locked); color: var(--locked-fg); box-shadow: 0 4px 0 var(--locked-deep); }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.banner h2 { margin: 2px 0 2px; font-size: 22px; font-weight: 900; text-wrap: balance; }
.banner p { margin: 0; font-weight: 600; opacity: .92; max-width: 46ch; }
.jump { flex: none; background: var(--surface); color: var(--fg); border: 2px solid var(--line-deep); border-bottom-width: 4px; border-radius: 12px; padding: 8px 14px; font-weight: 800; font-size: 14px; }
.jump:active { transform: translateY(2px); border-bottom-width: 2px; }
.nodes { display: grid; justify-items: center; gap: 22px; padding-block: 6px 10px; --zig: 1; }
.node-wrap { position: relative; display: grid; justify-items: center; gap: 6px; transform: translateX(calc(var(--x) * var(--zig))); }
.node { width: 72px; height: 72px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); box-shadow: 0 6px 0 var(--primary-deep); transition: transform .08s; }
.node svg { width: 32px; height: 32px; }
.node:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--primary-deep); }
.node.done { background: var(--brass); box-shadow: 0 6px 0 color-mix(in srgb, var(--brass) 60%, #000); }
.node.locked { background: var(--locked); color: var(--locked-fg); box-shadow: 0 6px 0 var(--locked-deep); cursor: not-allowed; }
.node.current { box-shadow: 0 6px 0 var(--primary-deep), 0 0 0 8px var(--primary-soft); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 6px 0 var(--primary-deep), 0 0 0 13px var(--primary-soft); } }
.node-label { font-size: 14px; font-weight: 800; color: var(--muted); text-align: center; max-width: 16ch; }
.start { position: absolute; top: -40px; background: var(--surface); color: var(--primary); border: 2px solid var(--line); border-radius: 10px; padding: 3px 12px; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.start::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 12px; height: 12px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }

.side { display: grid; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); min-width: 0; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px; min-width: 0; }
.card h3 { margin: 0; font-size: 17px; font-weight: 900; }
.card p { margin: 0; font-weight: 600; color: var(--muted); font-size: 15px; }
.card .quote-sm { font-family: var(--f-quote); font-style: italic; font-size: 19px; line-height: 1.35; color: var(--fg); }
.card .who-sm { font-size: 13px; color: var(--muted); }
.reveal-body { display: grid; gap: 8px; }
.reveal-body[hidden] { display: none; }
.reveal-body b { color: var(--good); }
.meta { font-size: 13px; color: var(--muted); font-weight: 700; }
.bar-mini { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar-mini > i { display: block; height: 100%; background: var(--brass); }
.kv { display: flex; justify-content: space-between; font-weight: 800; font-variant-numeric: tabular-nums; }
.linkbtn { justify-self: start; background: none; border: 0; padding: 0; color: var(--primary); font-weight: 800; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* course tabs */
.path-col { display: grid; gap: 24px; min-width: 0; }
.tabs { display: flex; gap: 8px; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 6px; }
.tab { flex: 1; border: 0; background: none; border-radius: 11px; padding: 10px 12px; font-weight: 900; font-size: 15px; color: var(--muted); letter-spacing: .02em; }
.tab.on { background: var(--primary); color: var(--on-primary); box-shadow: 0 3px 0 var(--primary-deep); }
.tab:not(.on):hover { background: var(--primary-soft); color: var(--primary); }
.potd-q { color: var(--fg) !important; font-weight: 800 !important; font-size: 16px !important; }

/* news card */
.news { background: var(--surface); border: 2px solid var(--line); border-left: 6px solid var(--brass); border-radius: 12px; padding: 12px 16px; display: grid; gap: 4px; }
.news-k { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--brass); }
.news-h { margin: 0; font-family: var(--f-quote); font-style: italic; font-size: 20px; line-height: 1.3; }
.news-d { font-size: 13px; color: var(--muted); font-weight: 700; }

/* group play */
.seg { display: flex; gap: 4px; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 6px 8px; font-weight: 800; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--primary); box-shadow: 0 1px 0 var(--line-deep); }
.fld { display: grid; gap: 4px; font-size: 13px; font-weight: 800; color: var(--muted); }
.fld input { font: inherit; font-size: 16px; font-weight: 700; color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0; }
.fld input:focus { outline: none; border-color: var(--primary); }
.btn.sm { padding: 10px 16px; font-size: 14px; min-width: 0; justify-self: start; }
.card .gerr { color: var(--bad); font-weight: 700; }
.card .gerr a { color: inherit; }
.ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lb { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lb li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; font-weight: 800; font-size: 15px; }
.lb li.me { background: var(--primary-soft); }
.lb .rk { color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
.lb .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb .fl { display: flex; align-items: center; gap: 2px; color: var(--brass); font-variant-numeric: tabular-nums; }
.lb .fl.zero { color: var(--locked-fg); }
.lb .fl.risk { color: var(--bad); }
.lb .fl svg { width: 16px; height: 16px; }
.lb .pts { color: var(--primary); font-variant-numeric: tabular-nums; min-width: 58px; text-align: right; }
.gsub { margin: 6px 0 0; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.feed li { font-size: 14px; color: var(--muted); font-weight: 600; line-height: 1.35; }
.feed b { color: var(--fg); }
.beat { margin-left: 4px; background: none; border: 2px solid var(--line-deep); border-radius: 8px; padding: 0 8px; font-size: 12px; font-weight: 900; color: var(--primary); }
.rec { display: block; font-size: 13px; word-break: break-all; background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 6px 8px; color: var(--fg); }
.glinks { display: flex; flex-wrap: wrap; gap: 14px; }
.result .vs { color: var(--fg); font-weight: 800; }

/* shared buttons */
.btn { border: 0; border-radius: 14px; padding: 14px 28px; font-weight: 900; font-size: 16px; letter-spacing: .05em; text-transform: uppercase; background: var(--primary); color: var(--on-primary); box-shadow: 0 4px 0 var(--primary-deep); min-width: 150px; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--primary-deep); }
.btn:disabled { background: var(--locked); color: var(--locked-fg); box-shadow: 0 4px 0 var(--locked-deep); cursor: not-allowed; }
.btn.ghost { background: var(--surface); color: var(--fg); border: 2px solid var(--line-deep); box-shadow: 0 4px 0 var(--line-deep); }
.lfoot.good .btn { background: var(--good); box-shadow: 0 4px 0 var(--good-deep); }
.lfoot.bad .btn { background: var(--bad); box-shadow: 0 4px 0 var(--bad-deep); }

/* lesson overlay */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.lbar { width: 100%; max-width: 760px; margin: 0 auto; padding: 18px 16px 8px; display: flex; align-items: center; gap: 16px; }
.icon-btn { background: none; border: 0; padding: 4px; color: var(--muted); border-radius: 8px; }
.icon-btn svg { width: 26px; height: 26px; }
.progress { flex: 1; height: 16px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .35s ease; }
.stage { flex: 1; overflow-y: auto; width: 100%; }
.stage-in { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: grid; gap: 18px; }
.kicker { margin: 0; font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
.prompt { margin: 0; font-size: 26px; font-weight: 900; line-height: 1.2; text-wrap: balance; }
.speaker { display: flex; align-items: flex-end; gap: 14px; }
.avatar { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 900; font-size: 22px; border: 2px solid var(--line); position: relative; }
.avatar::after { content: ""; position: absolute; bottom: -6px; width: 14px; height: 10px; border-radius: 2px; background: var(--brass); }
.bubble { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 14px 18px; min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -9px; bottom: 16px; width: 14px; height: 14px; background: var(--surface); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.bubble q { quotes: none; font-family: var(--f-quote); font-style: italic; font-size: 21px; line-height: 1.35; display: block; }
.bubble .who { font-size: 13px; color: var(--muted); margin-top: 6px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-size: 16px; }
.opt:hover { background: color-mix(in srgb, var(--primary-soft) 50%, var(--surface)); }
.kbd { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 900; color: var(--muted); }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.opt.sel .kbd { border-color: var(--primary); color: var(--primary); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }

.match { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 10px 12px; }
.col { display: grid; gap: 10px; align-content: start; }
.tile { text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 15px; min-height: 64px; line-height: 1.3; }
.tile.term { font-weight: 900; font-size: 16px; }
.tile.sel { border-color: var(--primary); background: var(--primary-soft); }
.tile.matched { border-color: var(--line); background: var(--bg); color: var(--locked-fg); border-bottom-width: 2px; cursor: default; }
.tile.miss { border-color: var(--bad); background: var(--bad-bg); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.order { display: grid; gap: 8px; }
.end { font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: slot; }
.slots li { counter-increment: slot; display: flex; align-items: center; gap: 10px; min-height: 52px; }
.slots li::before { content: counter(slot); flex: none; width: 28px; text-align: center; font-weight: 900; color: var(--muted); font-variant-numeric: tabular-nums; }
.slots .empty { flex: 1; height: 48px; border: 2px dashed var(--line-deep); border-radius: 12px; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 8px; border-top: 2px solid var(--line); }
.chip { text-align: left; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 15px; }
.slots .chip { flex: 1; border-color: var(--primary); background: var(--primary-soft); }
.order-ans { margin: 0; padding-left: 22px; }

.lfoot { border-top: 2px solid var(--line); background: var(--bg); padding-inline: 16px; padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px)); transition: background .15s; }
.lfoot.good { background: var(--good-bg); border-top-color: transparent; }
.lfoot.bad { background: var(--bad-bg); border-top-color: transparent; }
.foot-in { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; }
.fb { flex: 1; min-width: 0; display: grid; gap: 6px; max-height: 38vh; overflow-y: auto; }
.fb h4 { margin: 0; font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
.fb h4 svg { width: 26px; height: 26px; }
.lfoot.good .fb h4 { color: var(--good); }
.lfoot.bad .fb h4 { color: var(--bad); }
.fb p { margin: 0; font-weight: 600; font-size: 15px; max-width: 62ch; }
.fb .ans { font-weight: 800; }
.fb .ask { border-left: 4px solid var(--brass); padding-left: 10px; }
.fb .ask span { display: block; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--brass); }
.fb.hint p { color: var(--muted); }
.foot-in .btn { flex: none; }

/* result screen */
.result { justify-content: center; align-items: center; padding-inline: 16px; overflow-y: auto; }
.result-in { max-width: 520px; width: 100%; display: grid; gap: 22px; justify-items: center; text-align: center; padding-block: 32px; }
.result h2 { margin: 0; font-size: 32px; font-weight: 900; color: var(--brass); text-wrap: balance; }
.result.failed h2 { color: var(--bad); }
.result p { margin: 0; color: var(--muted); max-width: 42ch; }
.seal { width: 120px; height: 120px; }
.rtiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.rtile { border: 2px solid var(--brass); border-radius: 14px; overflow: hidden; display: grid; }
.rtile .k { background: var(--brass); color: var(--surface); font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; padding: 4px; }
.rtile .v { font-size: 24px; font-weight: 900; padding: 10px 4px; font-variant-numeric: tabular-nums; }
.rtile.acc { border-color: var(--good); } .rtile.acc .k { background: var(--good); }
.rtile.st { border-color: var(--primary); } .rtile.st .k { background: var(--primary); }
.rbtns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 12px; font-weight: 800; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }

@media (max-width: 820px) {
  .home { grid-template-columns: 1fr; }
  .side { position: static; }
}
@media (max-width: 520px) {
  .nodes { --zig: .55; }
  .prompt { font-size: 22px; }
  .bubble q { font-size: 19px; }
  .stats { gap: 12px; }
  .brand { font-size: 19px; }
  .foot-in { flex-direction: column; align-items: stretch; }
  .foot-in .btn { width: 100%; }
  .match { grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr); gap: 8px; }
  .tile { padding: 10px; font-size: 14px; }
  .tile.term { font-size: 15px; }
  .rtile .v { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true" fill="currentColor"><rect x="15" y="2" width="2" height="5" rx="1"/><path d="M8 17a8 8 0 0 1 16 0z"/><rect x="5" y="17" width="22" height="3" rx="1"/><rect x="7" y="21" width="2.5" height="6"/><rect x="12" y="21" width="2.5" height="6"/><rect x="17.5" y="21" width="2.5" height="6"/><rect x="22.5" y="21" width="2.5" height="6"/><rect x="4" y="27" width="24" height="3" rx="1"/></svg>
      Hill Speak

let LESSONS = [];

  const C = COURSES[state.course];
  LESSONS = [];
  C.units.forEach((u, ui) => u.lessons.forEach((l, li) => LESSONS.push({ ...l, unit: ui, id: C.pre + 'u' + ui + 'l' + li })));

const jumpKey = ui => COURSES[state.course].pre ? COURSES[state.course].pre + ui : ui;
const curUnits = () => COURSES[state.course].units;
const OFFS = [0, 52, 78, 52, 0, -52, -78, -52];
const PRAISE = ['Nicely decoded.', 'Correct.', 'You read that right.', 'Exactly.'];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function dstr(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

let state = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.done) { if (!COURSES[s.course]) s.course = 'lingo'; return s; } } catch (e) {}
  return { done: {}, xp: 0, streak: 0, last: null, jumped: [], course: 'lingo' };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

function unlocked(i) {
  if (i === 0) return true;
  if (state.done[LESSONS[i - 1].id]) return true;
  return state.jumped.includes(jumpKey(LESSONS[i].unit));
}

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }

/* ---------- home ---------- */
function renderHome() {
  $('#xp').textContent = state.xp;
  $('#streak').textContent = state.streak;
  const cur = LESSONS.findIndex((l, i) => !state.done[l.id] && unlocked(i));
  let h = '', k = 0;
  $('#tabs').innerHTML = Object.entries(COURSES).map(([k, c]) => `<button class="tab${k === state.course ? ' on' : ''}" role="tab" aria-selected="${k === state.course}" data-course="${k}">${esc(c.name)}</button>`).join('');
  const C = COURSES[state.course];
  $('#caveat').innerHTML = `<h3>How sure are these answers?</h3>${C.caveat.map(t => `<p>${esc(t)}</p>`).join('')}<div class="meta">${esc(C.meta)}</div>`;
  curUnits().forEach((u, ui) => {
    const first = LESSONS.findIndex(l => l.unit === ui);
    const uLocked = !unlocked(first);
    const nDone = LESSONS.filter(l => l.unit === ui && state.done[l.id]).length;
    h += `<section class="unit${uLocked ? ' is-locked' : ''}"><div class="banner"><div><div class="eyebrow">Unit ${ui + 1} · ${nDone} of ${u.lessons.length} done</div><h2>${esc(u.title)}</h2><p>${esc(u.desc)}</p></div>${uLocked ? `<button class="jump" data-jump="${ui}">Jump here</button>` : ''}</div><div class="nodes">`;
    LESSONS.forEach((l, i) => {
      if (l.unit !== ui) return;
      const cls = state.done[l.id] ? 'done' : i === cur ? 'current' : unlocked(i) ? 'open' : 'locked';
      const icon = cls === 'done' ? ICON.check : cls === 'locked' ? ICON.lock : ICON.star;
      h += `<div class="node-wrap" style="--x:${OFFS[k++ % OFFS.length]}px">${cls === 'current' ? '<span class="start">Start</span>' : ''}<button class="node ${cls}" data-idx="${i}" aria-label="${esc(l.title)}${cls === 'locked' ? ' (locked)' : cls === 'done' ? ' (done)' : ''}">${icon}</button><span class="node-label">${esc(l.title)}</span></div>`;
    });
    h += '</div></section>';
  });
  $('#path').innerHTML = h;
  const nd = LESSONS.filter(l => state.done[l.id]).length;
  $('#pDone').textContent = nd + ' / ' + LESSONS.length;
  $('#pBar').style.width = (nd / LESSONS.length * 100) + '%';
}

$('#path').addEventListener('click', e => {
  const j = e.target.closest('[data-jump]');
  if (j) { const ui = +j.dataset.jump; const key = jumpKey(ui); if (!state.jumped.includes(key)) state.jumped.push(key); save(); renderHome(); return; }
  const n = e.target.closest('.node');
  if (!n) return;
  const i = +n.dataset.idx;
  if (!unlocked(i)) { toast('Finish the lesson before this one, or use Jump here on the unit.'); return; }
  startLesson(i);
});

function renderPotd() {
  const pool = LESSONS.flatMap(l => l.items).filter(it => it.t === 'mc' && (state.course === 'lingo' ? it.q : true));
  const day = Math.floor(new Date(dstr(new Date()) + 'T12:00:00').getTime() / 864e5);
  const it = pool[day % pool.length];
  const sp = SPEAKERS[it.who || 'm'];
  const head = it.q ? `<h3>Phrase of the day</h3><div class="quote-sm">${esc(it.q)}</div><div class="who-sm">${esc(sp.n)}, ${esc(sp.r)}</div>` : `<h3>Question of the day</h3><p class="potd-q">${esc(it.p)}</p>`;
  $('#potd').innerHTML = `${head}<div class="reveal-body" id="potdBody" hidden><p><b>${esc(it.o[it.a])}</b></p><p>${esc(it.x)}</p></div><button class="linkbtn" id="potdBtn">What it means</button>`;
  $('#potdBtn').onclick = () => { const b = $('#potdBody'); b.hidden = !b.hidden; $('#potdBtn').textContent = b.hidden ? 'What it means' : 'Hide'; };
}

let resetArmed = false;
$('#resetBtn').onclick = () => {
  if (!resetArmed) { resetArmed = true; $('#resetBtn').textContent = 'Click again to erase all progress'; setTimeout(() => { resetArmed = false; $('#resetBtn').textContent = 'Reset progress'; }, 4000); return; }
  state = { done: {}, xp: 0, streak: 0, last: null, jumped: [], course: state.course }; save(); resetArmed = false; $('#resetBtn').textContent = 'Reset progress'; renderHome(); toast('Progress reset.');
};

/* ---------- lesson ---------- */
let run = null;
function show(id) {
  ['#lesson', '#result'].forEach(s => $(s).hidden = s !== id);
  document.body.classList.toggle('in-lesson', id !== null);
}
function startLesson(i, challenge) {
  const L = LESSONS[i];
  run = { challenge: challenge || null, idx: i, queue: L.items.map((it, k) => ({ ...it, key: k })), total: L.items.length, correct: 0, hearts: 5, wrong: new Set(), cur: null, sel: null, phase: 'answer' };
  show('#lesson');
  nextItem();
}
function goHome() { run = null; show(null); renderHome(); window.scrollTo(0, 0); }
$('#quitBtn').onclick = goHome;

function updateBar() {
  $('#prog').style.width = (run.correct / run.total * 100) + '%';
  $('#hearts').textContent = run.hearts;
}
function setCheck(visible, enabled) { const b = $('#checkBtn'); b.hidden = !visible; b.disabled = !enabled; b.textContent = 'Check'; }
function resetFoot() { $('#foot').className = 'lfoot'; const fb = $('#fb'); fb.hidden = true; fb.className = 'fb'; fb.innerHTML = ''; }

function nextItem() {
  resetFoot();
  if (!run.queue.length) return finish();
  run.cur = run.queue.shift(); run.sel = null; run.phase = 'answer';
  updateBar();
  const it = run.cur;
  if (it.t === 'mc') renderMC(it); else if (it.t === 'match') renderMatch(it); else renderOrder(it);
  $('#stageWrap').scrollTop = 0;
}

function quoteHTML(it) {
  const sp = SPEAKERS[it.who || 'm'];
  return `<div class="speaker"><div class="avatar" aria-hidden="true">${sp.n[0]}</div><div class="bubble"><q>${esc(it.q)}</q><div class="who">${esc(sp.n)}, ${esc(sp.r)}</div></div></div>`;
}

function renderMC(it) {
  it._opts = shuffle(it.o.map((text, i) => ({ text, right: i === it.a })));
  const kicker = it.news ? 'Spot the procedure' : it.q ? 'Decode the staffer' : 'Choose the best answer';
  const news = it.news ? `<div class="news"><span class="news-k">In the news</span><p class="news-h">${esc(it.news.h)}</p><span class="news-d">${esc(it.news.d)} · paraphrased</span></div>` : '';
  $('#stage').innerHTML = `<p class="kicker">${kicker}</p>${news}<h3 class="prompt">${esc(it.p || 'What does this most likely mean?')}</h3>${it.q ? quoteHTML(it) : ''}<div class="opts" role="radiogroup">${it._opts.map((o, i) => `<button class="opt" role="radio" aria-checked="false" data-i="${i}"><span class="kbd">${i + 1}</span><span>${esc(o.text)}</span></button>`).join('')}</div>`;
  $('#stage').querySelectorAll('.opt').forEach(b => b.onclick = () => pickMC(+b.dataset.i));
  setCheck(true, false);
}
function pickMC(i) {
  if (run.phase !== 'answer') return;
  run.sel = i;
  $('#stage').querySelectorAll('.opt').forEach((b, k) => { b.classList.toggle('sel', k === i); b.setAttribute('aria-checked', k === i); });
  setCheck(true, true);
}

function renderMatch(it) {
  const L = shuffle(it.pairs.map((p, i) => ({ t: p[0], i })));
  const R = shuffle(it.pairs.map((p, i) => ({ t: p[1], i })));
  $('#stage').innerHTML = `<p class="kicker">Match the pairs</p><h3 class="prompt">${esc(it.p)}</h3><div class="match"><div class="col">${L.map(x => `<button class="tile term" data-s="l" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div><div class="col">${R.map(x => `<button class="tile" data-s="r" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div>`;
  run.m = { l: null, r: null, left: it.pairs.length, misses: 0 };
  $('#stage').querySelectorAll('.tile').forEach(b => b.onclick = () => pickTile(b));
  setCheck(false, false);
  const fb = $('#fb'); fb.hidden = false; fb.className = 'fb hint'; fb.innerHTML = '<p>Tap a term, then the meaning that goes with it.</p>';
}
function pickTile(b) {
  if (run.phase !== 'answer' || b.classList.contains('matched')) return;
  const side = b.dataset.s;
  $('#stage').querySelectorAll(`.tile[data-s="${side}"]`).forEach(x => x.classList.remove('sel'));
  if (run.m[side] === b) { run.m[side] = null; return; }
  b.classList.add('sel'); run.m[side] = b;
  const { l, r } = run.m;
  if (!l || !r) return;
  if (l.dataset.i === r.dataset.i) {
    [l, r].forEach(x => { x.classList.remove('sel'); x.classList.add('matched'); x.disabled = true; });
    run.m.left--;
    if (run.m.left === 0) setTimeout(() => {
      grade(true, '', run.m.misses ? `Matched, with ${run.m.misses} miss${run.m.misses > 1 ? 'es' : ''}.` : null);
    }, 300);
  } else {
    run.m.misses++; run.wrong.add(run.cur.key);
    [l, r].forEach(x => { x.classList.remove('sel'); x.classList.add('miss'); setTimeout(() => x.classList.remove('miss'), 450); });
  }
  run.m.l = null; run.m.r = null;
}

function renderOrder(it) {
  if (!run.pool || run.poolFor !== it) { run.pool = shuffle(it.items.map((_, i) => i)); run.ans = []; run.poolFor = it; }
  const slots = it.items.map((_, k) => `<li>${run.ans[k] !== undefined ? `<button class="chip" data-a="${k}">${esc(it.items[run.ans[k]])}</button>` : '<span class="empty"></span>'}</li>`).join('');
  const pool = run.pool.filter(i => !run.ans.includes(i)).map(i => `<button class="chip" data-p="${i}">${esc(it.items[i])}</button>`).join('');
  $('#stage').innerHTML = `<p class="kicker">Put them in order</p><h3 class="prompt">${esc(it.p)}</h3><div class="order"><div class="end">${esc(it.ends[0])}</div><ol class="slots">${slots}</ol><div class="end">${esc(it.ends[1])}</div></div><div class="pool">${pool || '<span class="end">All placed. Tap one above to take it back.</span>'}</div>`;
  $('#stage').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { if (run.phase !== 'answer') return; run.ans.push(+b.dataset.p); renderOrder(it); });
  $('#stage').querySelectorAll('[data-a]').forEach(b => b.onclick = () => { if (run.phase !== 'answer') return; run.ans.splice(+b.dataset.a, 1); renderOrder(it); });
  setCheck(true, run.ans.length === it.items.length);
}

function check() {
  const it = run.cur;
  if (it.t === 'mc') {
    if (run.sel === null) return;
    const ok = it._opts[run.sel].right;
    $('#stage').querySelectorAll('.opt').forEach((b, k) => {
      b.disabled = true; b.classList.remove('sel');
      if (it._opts[k].right) b.classList.add('right'); else if (k === run.sel) b.classList.add('wrong');
    });
    grade(ok, ok ? '' : `<p class="ans">Better answer: ${esc(it.o[it.a])}</p>`);
  } else if (it.t === 'order') {
    const ok = run.ans.every((v, i) => v === i);
    grade(ok, ok ? '' : `<p class="ans">A better order:</p><ol class="order-ans">${it.items.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`);
    run.poolFor = null;
  }
}

function grade(ok, ansHTML, heading) {
  const it = run.cur;
  run.phase = 'feedback';
  if (ok) run.correct++;
  else { run.hearts--; run.wrong.add(it.key); run.queue.push(it); }
  updateBar();
  const foot = $('#foot'); foot.className = 'lfoot ' + (ok ? 'good' : 'bad');
  const fb = $('#fb'); fb.hidden = false; fb.className = 'fb';
  const head = heading || (ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : 'Not quite.');
  fb.innerHTML = `<h4>${ok ? ICON.ok : ICON.no}${esc(head)}</h4>${ansHTML || ''}<p>${esc(it.x)}</p>${it.ask ? `<p class="ask"><span>Try asking</span>${esc(it.ask)}</p>` : ''}`;
  const b = $('#checkBtn'); b.hidden = false; b.disabled = false; b.textContent = 'Continue'; b.focus({ preventScroll: true });
}

$('#checkBtn').onclick = () => {
  if (!run) return;
  if (run.phase === 'feedback') { if (run.hearts <= 0) return fail(); nextItem(); }
  else check();
};

function finish() {
  const L = LESSONS[run.idx];
  state.done[L.id] = true;
  const firstTry = run.total - run.wrong.size;
  const gained = 10 + firstTry * 5;
  state.xp += gained;
  const today = dstr(new Date());
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (state.last !== today) { state.streak = state.last === dstr(y) ? state.streak + 1 : 1; state.last = today; }
  save();
  const acc = Math.round(firstTry / run.total * 100);
  groupPost(L, gained, acc);
  const nextL = LESSONS[run.idx + 1];
  $('#result').classList.remove('failed');
  $('#resultIn').innerHTML = `${ICON.seal}<h2>${acc === 100 ? 'Clean sweep.' : 'Lesson complete.'}</h2><p>${esc(L.title)}${nextL ? '. Up next: ' + esc(nextL.title) + '.' : '. That was the last lesson on the path.'}</p><div class="rtiles"><div class="rtile"><span class="k">XP</span><span class="v">+${gained}</span></div><div class="rtile acc"><span class="k">First try</span><span class="v">${acc}%</span></div><div class="rtile st"><span class="k">Streak</span><span class="v">${state.streak}d</span></div></div>${groupLine(acc)}<div class="rbtns"><button class="btn" id="rHome">Continue</button></div>`;
  show('#result');
  $('#rHome').onclick = goHome; $('#rHome').focus();
}
function fail() {
  const i = run.idx;
  $('#result').classList.add('failed');
  $('#resultIn').innerHTML = `${ICON.heart}<h2>Out of hearts.</h2><p>Five misses ends the lesson. You’ve now seen the explanations, so the second pass usually goes faster.</p><div class="rbtns"><button class="btn" id="rRetry">Try again</button><button class="btn ghost" id="rHome">Back to path</button></div>`;
  show('#result');
  $('#rRetry').onclick = () => startLesson(i); $('#rHome').onclick = goHome; $('#rRetry').focus();
}

document.addEventListener('keydown', e => {
  if (!run || $('#lesson').hidden) return;
  if (e.key === 'Escape') { goHome(); return; }
  if (e.key === 'Enter') { const b = $('#checkBtn'); if (!b.hidden && !b.disabled) { e.preventDefault(); b.click(); } return; }
  if (run.phase === 'answer' && run.cur.t === 'mc' && /^[1-9]$/.test(e.key)) { const i = +e.key - 1; if (i < run.cur._opts.length) pickMC(i); }
});

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-course]');
  if (!b || b.dataset.course === state.course) return;
  state.course = b.dataset.course; save(); buildLessons(); renderHome(); renderPotd();
});

/* ---------- group play ---------- */
const GKEY = 'hillspeak-group';
const SITE = 'https://hill-speak.alex-l-lintz.workers.dev';
const API = /workers\.dev$|^localhost$|^127\.0\.0\.1$/.test(location.hostname) ? '' : SITE;
const FLAME = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.5 2c.6 3.4 4.9 5.6 4.9 10.6A5.4 5.4 0 0 1 12 18a5.4 5.4 0 0 1-5.4-5.4c0-2.4 1.2-4 2.4-5 0 2 .9 3.2 2 3.4-.3-3.3.5-6.4 1.5-9z"/></svg>';
let G = (() => { try { return JSON.parse(localStorage.getItem(GKEY)); } catch (e) { return null; } })();
let board = null, gTab = 'week', gMode = 'join', gErr = '', gBusy = false, gOffline = false, recShown = false, leaveArmed = false;
const joinParam = (new URLSearchParams(location.search).get('join') || '').toUpperCase().slice(0, 6);
if (joinParam && !G) gMode = 'join';
function saveG() { try { G ? localStorage.setItem(GKEY, JSON.stringify(G)) : localStorage.removeItem(GKEY); } catch (e) {} }

async function apiCall(path, bodyObj) {
  const headers = { 'Content-Type': 'application/json' };
  if (G && G.token) headers.Authorization = 'Bearer ' + G.token;
  const r = await fetch(API + path, { method: bodyObj ? 'POST' : 'GET', headers, body: bodyObj ? JSON.stringify(bodyObj) : undefined });
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error(d.error || 'Something went wrong.'); e.status = r.status; throw e; }
  return d;
}
function netMsg(e) {
  return e instanceof TypeError ? `Can’t reach the group server from this page. Group play works at <a href="${SITE}">${SITE.replace('https://', '')}</a>.` : esc(e.message);
}
function ago(ms) {
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + 'm ago';
  const h = Math.round(m / 60); if (h < 24) return h + 'h ago';
  return Math.round(h / 24) + 'd ago';
}

async function refreshBoard() {
  if (!G) return renderGroup();
  try { board = await apiCall('/api/board?today=' + dstr(new Date())); gOffline = false; G.groupName = board.groupName; saveG(); }
  catch (e) { if (e.status === 401) { G = null; saveG(); board = null; gErr = 'That group sign-in no longer works. Join again or use a recovery code.'; } else gOffline = true; }
  renderGroup();
}

function renderGroup() {
  const el = $('#group');
  if (!G) {
    const modes = [['join', 'Join'], ['start', 'Start a group'], ['restore', 'Recovery code']];
    let form = '';
    if (gMode === 'join') form = `<label class="fld"><span>Invite code</span><input id="gCode" maxlength="6" autocomplete="off" autocapitalize="characters" value="${esc(joinParam)}"></label><label class="fld"><span>Your display name</span><input id="gName" maxlength="24" autocomplete="nickname"></label><button class="btn sm" id="gGo">Join group</button>`;
    else if (gMode === 'start') form = `<label class="fld"><span>Group name</span><input id="gGroup" maxlength="40"></label><label class="fld"><span>Your display name</span><input id="gName" maxlength="24" autocomplete="nickname"></label><button class="btn sm" id="gGo">Start group</button>`;
    else form = `<label class="fld"><span>Recovery code</span><input id="gRecIn" autocomplete="off" spellcheck="false"></label><button class="btn sm" id="gGo">Restore</button>`;
    el.innerHTML = `<h3>Play with friends</h3><p>Join a group to see each other’s streaks and compete on weekly XP. Your display name and finished lessons are visible to the group.</p><div class="seg">${modes.map(([k, t]) => `<button data-gmode="${k}" class="${k === gMode ? 'on' : ''}">${t}</button>`).join('')}</div>${form}${gErr ? `<p class="gerr">${gErr}</p>` : ''}`;
    $('#gGo').disabled = gBusy;
    return;
  }
  let h = `<div class="ghead"><h3>${esc(G.groupName)}</h3><button class="linkbtn" id="gInvite">Copy invite link</button></div><div class="meta">Code ${esc(G.code)} · You’re ${esc(G.player.name)}</div>`;
  if (gOffline) h += `<p class="gerr">Can’t reach the group server right now. Lessons you finish still count on this device.</p>`;
  if (board) {
    const key = gTab === 'week' ? 'week' : 'total';
    const rows = board.players.slice().sort((a, b) => b[key] - a[key] || b.streak - a.streak || a.name.localeCompare(b.name));
    h += `<div class="seg"><button data-gtab="week" class="${gTab === 'week' ? 'on' : ''}">This week</button><button data-gtab="all" class="${gTab === 'all' ? 'on' : ''}">All time</button></div>`;
    h += `<ol class="lb">${rows.map((r, i) => {
      const fl = r.streak === 0 ? 'zero' : r.atRisk ? 'risk' : '';
      const tip = r.streak === 0 ? 'No current streak' : r.atRisk ? `${r.streak}-day streak, ends tonight without a lesson` : `${r.streak}-day streak`;
      return `<li class="${r.id === board.me ? 'me' : ''}"><span class="rk">${i + 1}</span><span class="nm">${esc(r.name)}</span><span class="fl ${fl}" title="${esc(tip)}">${FLAME}${r.streak}</span><span class="pts">${r[key]} XP</span></li>`;
    }).join('')}</ol>`;
    if (gTab === 'week') h += `<p class="meta">Weekly XP resets Monday 00:00 UTC.</p>`;
    if (board.feed.length) h += `<h4 class="gsub">Recent</h4><ul class="feed">${board.feed.slice(0, 8).map(f => `<li><b>${esc(f.name)}</b> finished ${esc(f.title)} · ${f.acc}% · ${ago(f.at)}${f.id !== board.me ? `<button class="beat" data-beat="${esc(f.lessonId)}" data-who="${esc(f.name)}" data-acc="${f.acc}">Beat it</button>` : ''}</li>`).join('')}</ul>`;
    else h += `<p>No lessons finished yet. Be the first.</p>`;
  } else if (!gOffline) h += `<p>Loading…</p>`;
  h += recShown ? `<p>Save this code to use the same account on another device. Anyone with it can post as you.</p><code class="rec">${esc(G.token)}</code>` : '';
  h += `<div class="glinks"><button class="linkbtn" id="gRec">${recShown ? 'Hide recovery code' : 'Recovery code'}</button><button class="linkbtn" id="gLeave">${leaveArmed ? 'Click again to leave' : 'Leave group'}</button></div>`;
  el.innerHTML = h;
}

async function groupSubmit() {
  gErr = ''; gBusy = true; renderGroupKeep();
  try {
    let d;
    if (gMode === 'restore') {
      const tok = ($('#gRecIn').value || '').trim();
      if (!tok.includes('.')) throw new Error('That doesn’t look like a recovery code.');
      G = { token: tok }; const me = await apiCall('/api/me'); d = { ...me, token: tok };
    } else if (gMode === 'start') d = await apiCall('/api/groups', { groupName: $('#gGroup').value, name: $('#gName').value });
    else d = await apiCall('/api/join', { code: $('#gCode').value, name: $('#gName').value });
    G = { token: d.token, code: d.code, groupName: d.groupName, player: d.player }; saveG();
    if (joinParam) history.replaceState(null, '', location.pathname);
    toast('You’re in ' + d.groupName + '.');
    gBusy = false; await refreshBoard();
  } catch (e) {
    if (gMode === 'restore') { G = null; }
    gBusy = false; gErr = netMsg(e); renderGroupKeep();
  }
}
// Re-render the form without wiping what the person typed.
function renderGroupKeep() {
  const vals = {}; ['gCode', 'gName', 'gGroup', 'gRecIn'].forEach(id => { const x = document.getElementById(id); if (x) vals[id] = x.value; });
  renderGroup();
  Object.entries(vals).forEach(([id, v]) => { const x = document.getElementById(id); if (x) x.value = v; });
}

$('#group').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.gmode) { gMode = t.dataset.gmode; gErr = ''; renderGroupKeep(); return; }
  if (t.dataset.gtab) { gTab = t.dataset.gtab; renderGroup(); return; }
  if (t.id === 'gGo') { groupSubmit(); return; }
  if (t.id === 'gInvite') {
    const link = SITE + '/?join=' + G.code;
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Invite link copied.'), () => toast(link));
    return;
  }
  if (t.id === 'gRec') { recShown = !recShown; renderGroup(); return; }
  if (t.id === 'gLeave') {
    if (!leaveArmed) { leaveArmed = true; renderGroup(); setTimeout(() => { leaveArmed = false; if (G) renderGroup(); }, 4000); return; }
    G = null; board = null; leaveArmed = false; recShown = false; saveG(); renderGroup(); toast('Left the group on this device. Your recovery code still works.'); return;
  }
  if (t.dataset.beat) {
    const id = t.dataset.beat, course = Object.keys(COURSES).find(k => COURSES[k].pre && id.startsWith(COURSES[k].pre)) || 'lingo';
    if (course !== state.course) { state.course = course; save(); buildLessons(); renderHome(); renderPotd(); }
    const i = LESSONS.findIndex(l => l.id === id);
    if (i < 0) { toast('That lesson isn’t available anymore.'); return; }
    startLesson(i, { name: t.dataset.who, acc: +t.dataset.acc });
  }
});
$('#group').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input')) { e.preventDefault(); groupSubmit(); } });

function groupPost(L, xp, acc) {
  if (!G) return;
  apiCall('/api/complete', { lessonId: L.id, title: L.title, xp, acc, day: dstr(new Date()) }).then(refreshBoard, () => { gOffline = true; renderGroup(); });
}
function groupLine(acc) {
  let s = '';
  if (run.challenge) { const c = run.challenge; s += `<p class="vs">${acc > c.acc ? 'You beat' : acc === c.acc ? 'You tied' : 'You didn’t beat'} ${esc(c.name)}: ${acc}% vs ${c.acc}% first try.</p>`; }
  if (G) s += `<p>Posted to ${esc(G.groupName)}.</p>`;
  return s;
}
setInterval(() => { if (G && !document.hidden && !run) refreshBoard(); }, 60000);
document.addEventListener('visibilitychange', () => { if (G && !document.hidden && !run) refreshBoard(); });

buildLessons();
renderHome();
renderPotd();
refreshBoard();
</script>
</body></html>
