# XcodeGen spec for the iPhone app. Regenerate App.xcodeproj with `xcodegen` in this folder after changing it
# (ios/build.sh does). Capacitor still manages CapApp-SPM/Package.swift and App/public via `npx cap sync ios`.
name: App
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: ../debug.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "10"
    CODE_SIGN_STYLE: Automatic
    # Alex's Apple developer team (individual).
    DEVELOPMENT_TEAM: 29B8GL5NYV
    TARGETED_DEVICE_FAMILY: "1"
packages:
  CapApp-SPM:
    path: CapApp-SPM
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - public
          - "*.entitlements"
      - path: App/public
        type: folder
        buildPhase: resources
      - path: Shared
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alexlintz.wonkolingo
        # Passkeys for the live site (served from /.well-known/apple-app-site-association by the Worker).
        com.apple.developer.associated-domains:
          - webcredentials:wonkolingo.alex-l-lintz.workers.dev
        # Sign in with Apple (WonkoNativePlugin.appleSignIn).
        com.apple.developer.applesignin:
          - Default
        # Push notifications from friends (src/push.js). Xcode switches this to production when exporting for TestFlight.
        aps-environment: development
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1" # iPhone only; with iPad, App Store Connect requires all four orientations
        PRODUCT_BUNDLE_IDENTIFIER: com.alexlintz.wonkolingo
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - package: CapApp-SPM
        product: CapApp-SPM
      - target: WonkoWidget
  WonkoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WonkoWidget
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Shared
    info:
      path: WonkoWidget/Info.plist
      properties:
        CFBundleDisplayName: WonkoLingo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WonkoWidget/WonkoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alexlintz.wonkolingo
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1" # iPhone only; with iPad, App Store Connect requires all four orientations
        PRODUCT_BUNDLE_IDENTIFIER: com.alexlintz.wonkolingo.widget
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
