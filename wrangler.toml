name = "wonkolingo"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./docs"
binding = "ASSETS"
run_worker_first = ["/api/*", "/.well-known/*", "/content.json"]

[[d1_databases]]
binding = "DB"
database_name = "hill-speak"
database_id = "0c6cfe6d-28ad-4e54-9b96-78d55d165124"

# Sender for sign-in and confirmation codes (src/email.js). Email switches on once the RESEND_API_KEY secret is set too.
[vars]
EMAIL_FROM = "WonkoLingo <codes@wonkolingo.com>"
# Players who can open the review page (/admin.html). Alex's account.
ADMIN_PLAYERS = "2rpep26wjp"
# Google sign-in (Google Cloud OAuth clients; ids aren't secret). Web: the site's Google button. iOS: the iPhone app.
GOOGLE_CLIENT_ID = "752750115216-ahqvib60io00s4eiqfsqch4c9vjbo0u0.apps.googleusercontent.com"
